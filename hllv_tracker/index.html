<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A public evidence ledger for Hell Let Loose: Vietnam issues and community-server incidents.">
  <title>HLLV Issue Dossiers</title>
  <style>
    :root{--rail:#171a17;--rail-2:#20241f;--paper:#eee9db;--paper-2:#f7f3e9;--ink:#20231f;--muted:#686d65;--line:#c8c1b0;--olive:#526048;--olive-2:#768467;--red:#a74732;--amber:#b87d27;--green:#416c4c;--white:#f7f5ed}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}.app{min-height:calc(100vh - 66px);display:block}button,input,select{font:inherit}
    .rail{display:none}.issue-id{font:.65rem "Courier New",monospace;color:#828a7e;letter-spacing:.06em;text-transform:uppercase}
    .workspace{min-width:0;background:linear-gradient(rgba(75,78,68,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(75,78,68,.035) 1px,transparent 1px),var(--paper);background-size:24px 24px}.workspace-bar{height:52px;padding:0 30px;display:flex;align-items:center;border-bottom:1px solid var(--line);font:.67rem "Courier New",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.dossier{max-width:980px;margin:0 auto;padding:34px 38px 64px}.case-head{display:grid;grid-template-columns:1fr auto;gap:28px;padding-bottom:20px;border-bottom:3px double var(--ink)}.case-label{font:.67rem "Courier New",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.case-head h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.2rem,4vw,3.8rem);letter-spacing:-.04em;line-height:.98;margin:7px 0 10px;max-width:720px}.scope{color:var(--muted);font:.67rem "Courier New",monospace;text-transform:uppercase}.scope span+span:before{content:" · ";color:#9b9484}.stamp{align-self:start;border:3px solid currentColor;color:var(--red);padding:7px 9px;transform:rotate(2deg);font:900 .69rem "Courier New",monospace;text-transform:uppercase;letter-spacing:.07em;max-width:145px;text-align:center}.stamp.testing{color:var(--amber)}.stamp.shipped{color:var(--green)}.stamp.partial{color:#8b5934}
    .tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-top:19px}.tab{border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);padding:10px 14px 8px;cursor:pointer;font-size:.73rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.tab:hover{color:var(--ink)}.tab.active{color:var(--ink);border-bottom-color:var(--red)}.panel{display:none;padding-top:22px}.panel.active{display:block}.bottom-line{max-width:760px;font:1.35rem/1.5 Georgia,"Times New Roman",serif;margin:0 0 25px}.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.fact{padding:12px 12px 12px 0}.fact+.fact{border-left:1px solid var(--line);padding-left:12px}.fact-label{display:block;color:var(--muted);font:.63rem "Courier New",monospace;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}.fact-value{font-size:.82rem;font-weight:700}
    .assessment{display:grid;grid-template-columns:1fr 1fr;gap:25px 36px}.block{min-width:0}.block.full{grid-column:1/-1}.block h2{margin:0 0 8px;font:.66rem "Courier New",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.block p{margin:0;font-size:.86rem;line-height:1.6}.fact-list{list-style:none;margin:0;padding:0}.fact-list li{position:relative;padding:7px 0 7px 19px;border-top:1px solid #d5cebd;font-size:.81rem;line-height:1.45}.fact-list li:before{position:absolute;left:0;font-family:"Courier New",monospace;font-weight:900}.known li:before{content:"+";color:var(--green)}.unknown li:before{content:"?";color:var(--red)}.workaround{border-left:4px solid var(--amber);background:rgba(255,255,255,.36);padding:13px 15px}.workaround h2{color:#8a5d1e}.none{color:#858a82;font-style:italic}
    .timeline{position:relative;margin-left:88px;border-left:1px solid #aaa392}.event{position:relative;padding:0 0 28px 26px}.event:last-child{padding-bottom:0}.event:before{content:"";position:absolute;left:-5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px var(--paper)}.event-date{position:absolute;right:calc(100% + 18px);top:0;width:80px;text-align:right;font:.68rem "Courier New",monospace;color:var(--muted)}.event h3{margin:0 0 4px;font-size:.9rem}.event p{margin:0;color:#5d625b;font-size:.84rem;line-height:1.55}.source-list{border-top:1px solid var(--ink)}.source-row{display:grid;grid-template-columns:100px minmax(160px,.7fr) 1.4fr auto;gap:16px;align-items:start;padding:15px 0;border-bottom:1px solid var(--line);font-size:.79rem}.source-date{font-family:"Courier New",monospace;color:var(--muted)}.source-title{font-weight:700}.source-claim{color:#5f645d}.source-link{color:var(--red);font-weight:800;text-decoration:none}.source-link:hover{text-decoration:underline}.blank{height:60vh;display:grid;place-items:center;color:var(--muted);font-family:"Courier New",monospace}.hidden{display:none!important}.back{border:0;background:none;color:var(--red);padding:0;cursor:pointer;font:700 .7rem "Courier New",monospace;text-transform:uppercase;letter-spacing:.07em}.back:hover{text-decoration:underline}
    .site-nav{height:66px;background:var(--rail);color:var(--white);display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:5px solid var(--red)}.home-brand{font-weight:800;letter-spacing:.06em;text-transform:uppercase}.home-date{color:#9ca397;font:.7rem "Courier New",monospace}.home{min-height:calc(100vh - 66px);background:#f4f1e8}.home-main{max-width:940px;margin:0 auto;padding:48px 22px 72px}.home-title{margin-bottom:18px}.home-kicker{color:var(--red);font:.7rem "Courier New",monospace;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:9px}.home-title h1{margin:0;font:700 clamp(2.7rem,6vw,4.7rem)/.95 Georgia,"Times New Roman",serif;letter-spacing:-.05em}.home-title p{margin:12px 0 0;color:var(--muted);font-size:.96rem}.home-summary{display:flex;gap:22px;padding:17px 0 22px;border-bottom:1px solid var(--line);color:var(--muted);font-size:.78rem}.home-summary strong{color:var(--ink);font-size:1rem;margin-right:4px}.home-tools{display:grid;grid-template-columns:1fr 180px;gap:9px;margin:25px 0 24px}.home-search,.home-category{height:44px;border:1px solid #bbb4a4;background:#fffdf7;color:var(--ink);padding:0 12px;outline:none;border-radius:3px}.home-search:focus,.home-category:focus{border-color:var(--olive)}.home-list{display:flex;flex-direction:column;gap:25px}.group-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}.group-head h2{margin:0;font:700 1rem Georgia,"Times New Roman",serif}.group-head span{color:var(--muted);font:.68rem "Courier New",monospace}.group-rows{display:flex;flex-direction:column;gap:8px}.home-issue{width:100%;border:1px solid var(--line);border-left:4px solid var(--red);background:#fffdf7;color:var(--ink);padding:17px 16px;display:grid;grid-template-columns:1fr auto;gap:18px;text-align:left;cursor:pointer;transition:transform .15s,border-color .15s}.home-issue:hover{transform:translateX(3px);border-color:#9c9482}.home-issue.testing{border-left-color:var(--amber)}.home-issue.partial{border-left-color:#8b5934}.home-issue.shipped{border-left-color:var(--green)}.home-issue h3{margin:0 0 5px;font:700 1.1rem Georgia,"Times New Roman",serif}.home-issue p{margin:0;max-width:650px;color:#646961;font-size:.84rem;line-height:1.45}.home-state{display:flex;align-items:center;gap:9px;align-self:center;color:var(--muted);font-size:.72rem;font-weight:700;white-space:nowrap}.home-state:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}.home-state.testing:before{background:var(--amber)}.home-state.shipped:before{background:var(--green)}.home-state.partial:before{background:#8b5934}.arrow{font-size:1.35rem;color:#8b8e87}.home-empty{padding:32px 4px;color:var(--muted);text-align:center}.workspace{min-height:calc(100vh - 66px)}
    @media(max-width:900px){.dossier{padding:30px 26px 58px}.workspace-bar{padding:0 26px}.case-head{grid-template-columns:1fr}.stamp{position:absolute;right:28px;top:82px}.facts{grid-template-columns:repeat(2,1fr)}.fact:nth-child(3){border-left:0}.fact:nth-child(-n+2){border-bottom:1px solid var(--line)}.assessment{grid-template-columns:1fr}.block.full{grid-column:auto}.source-row{grid-template-columns:85px 1fr auto}.source-claim{grid-column:2/-1}}
    @media(max-width:680px){.site-nav{height:58px;padding:0 16px}.home-date{display:none}.home-main{padding:34px 16px 55px}.home-title h1{font-size:2.85rem}.home-title p{font-size:.9rem}.home-summary{gap:14px;flex-wrap:wrap}.home-tools{grid-template-columns:1fr;margin:20px 0}.home-category{height:40px}.home-issue{grid-template-columns:1fr;padding:15px 14px;gap:8px}.home-state{justify-self:start}.arrow{display:none}.app{display:block}.workspace-bar{height:42px;padding:0 16px}.dossier{padding:22px 16px 48px}.case-head{gap:13px}.case-head h1{font-size:2.35rem;padding-right:0}.stamp{position:static;transform:none;max-width:none;justify-self:start}.tabs{overflow:auto}.tab{padding:9px 11px;white-space:nowrap}.bottom-line{font-size:1.18rem}.assessment{gap:22px}.timeline{margin-left:72px}.event-date{width:66px}.source-row{grid-template-columns:1fr auto;gap:5px 12px}.source-date{grid-column:1}.source-title{grid-column:1}.source-claim{grid-column:1/-1}.source-link{grid-column:2;grid-row:1/3}}
  </style>
</head>
<body>
  <header class="site-nav"><div class="home-brand">HLLV Bug Tracker</div><div class="home-date" id="homeDate">Loading…</div></header>
  <div class="home" id="home">
    <main class="home-main">
      <div class="home-title"><div class="home-kicker">Current issue status</div><h1>What's happening<br>with HLLV?</h1><p>Player reports and official updates, kept separate.</p></div>
      <div class="home-summary"><span><strong id="trackedCount">—</strong>tracked</span><span><strong id="openCount">—</strong>open</span><span><strong id="fixedCount">—</strong>fix released</span></div>
      <div class="home-tools"><input class="home-search" id="homeSearch" type="search" placeholder="Search bugs" autocomplete="off" aria-label="Search bugs"><select class="home-category" id="homeCategory" aria-label="Filter bugs"><option value="all">All issues</option><option value="gameplay">Gameplay</option><option value="voip">Voice chat</option><option value="stability">Crashes</option><option value="map-collision">Maps</option><option value="community-server">Servers</option></select></div>
      <div class="home-list" id="homeList"><div class="home-empty">Loading issues…</div></div>
    </main>
  </div>
  <div class="app hidden" id="app">
    <aside class="rail">
      <div class="rail-head"><div class="brand"><div class="brand-mark">H/V</div><div><strong>Issue Dossiers</strong><span>Public evidence index</span></div></div><div class="index-count" id="indexCount">Loading record…</div></div>
      <div class="controls"><input class="search" id="search" type="search" placeholder="Search dossiers" autocomplete="off" aria-label="Search dossiers"><select class="category" id="category" aria-label="Filter by category"><option value="all">All categories</option><option value="gameplay">Gameplay</option><option value="voip">VOIP</option><option value="stability">Stability</option><option value="map-collision">Map / collision</option><option value="community-server">Community server</option></select></div>
      <nav class="issue-list" id="issueList" aria-label="Issue dossiers"></nav>
      <div class="rail-foot">Unknown is valid · Evidence first</div>
    </aside>
    <main class="workspace">
      <div class="workspace-bar"><button class="back" id="back">← All issues</button></div>
      <article class="dossier" id="dossier"><div class="blank">Loading dossier…</div></article>
    </main>
  </div>
  <script>
    let dataset,selectedId,searchTerm='',category='all',homeSearchTerm='',homeCategory='all',activeTab='summary';
    const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    const human=s=>String(s??'').replaceAll('-',' ').replace(/\b\w/g,c=>c.toUpperCase());
    const searchable=i=>[i.id,i.title,i.category,i.kind,i.status_label,i.symptom,i.official_position,i.workaround,...i.scope,...i.known,...i.unknown].filter(Boolean).join(' ').toLowerCase();
    function filtered(){return dataset.issues.filter(i=>(category==='all'||i.category===category)&&(!searchTerm||searchable(i).includes(searchTerm)))}
    function renderList(){const issues=filtered();document.getElementById('indexCount').textContent=`${issues.length} issues · ${dataset.generated_at}`;document.getElementById('issueList').innerHTML=issues.length?issues.map(i=>`<button class="issue-button ${i.id===selectedId?'active':''}" data-id="${esc(i.id)}"><span class="issue-title">${esc(i.title)}</span><span class="dot ${esc(i.status_key)}" aria-label="${esc(i.status_label)}"></span></button>`).join(''):'<div class="empty-list">No matches.</div>';document.querySelectorAll('#issueList [data-id]').forEach(b=>b.addEventListener('click',()=>selectIssue(b.dataset.id,false)))}
    function plainStatus(i){return ({investigating:'Still being investigated',testing:'Fix being tested',partial:'Partially addressed',shipped:'Fix released'})[i.status_key]||i.status_label}
    function homeFiltered(){return dataset.issues.filter(i=>(homeCategory==='all'||i.category===homeCategory)&&(!homeSearchTerm||searchable(i).includes(homeSearchTerm)))}
    function renderHome(){const issues=homeFiltered(),all=dataset.issues;document.getElementById('trackedCount').textContent=all.length;document.getElementById('openCount').textContent=all.filter(i=>i.status_key!=='shipped').length;document.getElementById('fixedCount').textContent=all.filter(i=>i.status_key==='shipped').length;const row=i=>`<button class="home-issue ${esc(i.status_key)}" data-home-id="${esc(i.id)}"><span><h3>${esc(i.title)}</h3><p>${esc(i.bottom_line)}</p></span><span class="home-state ${esc(i.status_key)}">${esc(plainStatus(i))}<span class="arrow">›</span></span></button>`;const groups=[['Open issues',issues.filter(i=>i.status_key!=='shipped')],['Fix released',issues.filter(i=>i.status_key==='shipped')]].filter(([,items])=>items.length);document.getElementById('homeList').innerHTML=groups.length?groups.map(([name,items])=>`<section class="issue-group"><div class="group-head"><h2>${name}</h2><span>${items.length}</span></div><div class="group-rows">${items.map(row).join('')}</div></section>`).join(''):'<div class="home-empty">No matching issues.</div>';document.querySelectorAll('[data-home-id]').forEach(b=>b.addEventListener('click',()=>selectIssue(b.dataset.homeId,true)))}
    function showHome(push=false){if(push)history.pushState(null,'',location.pathname+location.search);document.getElementById('home').classList.remove('hidden');document.getElementById('app').classList.add('hidden');document.title='HLLV Bug Tracker';window.scrollTo({top:0,behavior:'smooth'})}
    function showDossier(){document.getElementById('home').classList.add('hidden');document.getElementById('app').classList.remove('hidden');renderList();renderDossier()}
    function selectIssue(id,push){selectedId=id;activeTab='summary';if(push)history.pushState(null,'',`#${id}`);else history.replaceState(null,'',`#${id}`);showDossier();if(window.innerWidth<681)document.getElementById('dossier').scrollIntoView({behavior:'smooth'})}
    function route(){const hash=location.hash.slice(1),valid=dataset.issues.some(i=>i.id===hash);if(valid){selectedId=hash;activeTab='summary';showDossier()}else showHome(false)}
    function list(items,cls){return `<ul class="fact-list ${cls}">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
    function summary(i){return `<p class="bottom-line">${esc(i.bottom_line)}</p><div class="facts"><div class="fact"><span class="fact-label">Official</span><span class="fact-value">${esc(i.official_short)}</span></div><div class="fact"><span class="fact-label">Fix</span><span class="fact-value">${esc(i.fix_short)}</span></div><div class="fact"><span class="fact-label">Cause</span><span class="fact-value">${esc(i.cause_short)}</span></div><div class="fact"><span class="fact-label">Updated</span><span class="fact-value">${esc(i.last_updated)}</span></div></div>`}
    function assessment(i){return `<div class="assessment"><section class="block full"><h2>Reported behavior</h2><p>${esc(i.symptom)}</p></section><section class="block full"><h2>Official position</h2><p>${esc(i.official_position)}</p></section><section class="block"><h2>Established</h2>${list(i.known,'known')}</section><section class="block"><h2>Still unknown</h2>${list(i.unknown,'unknown')}</section><section class="block full workaround"><h2>Workaround</h2><p class="${i.workaround?'':'none'}">${esc(i.workaround||'None recorded.')}</p></section></div>`}
    function timeline(i){return `<div class="timeline">${i.timeline.map(e=>`<section class="event"><time class="event-date">${esc(e.date)}</time><h3>${esc(e.event)}</h3><p>${esc(e.detail)}</p></section>`).join('')}</div>`}
    function sources(i){return `<div class="source-list">${i.sources.map(s=>`<div class="source-row"><time class="source-date">${esc(s.date)}</time><div class="source-title">${esc(s.title)}<br><span class="issue-id">${esc(s.publisher)} · ${esc(s.type)}</span></div><div class="source-claim">${esc(s.claim)}</div><a class="source-link" href="${esc(s.url)}" target="_blank" rel="noreferrer">Open ↗</a></div>`).join('')}</div>`}
    function renderDossier(){const i=dataset.issues.find(x=>x.id===selectedId);if(!i){document.getElementById('dossier').innerHTML='<div class="blank">Select an issue.</div>';return}document.title=`${i.id} · ${i.title}`;document.getElementById('dossier').innerHTML=`<header class="case-head"><div><div class="case-label">${esc(i.id)} · ${esc(i.kind)}</div><h1>${esc(i.title)}</h1><div class="scope">${i.scope.map(s=>`<span>${esc(s)}</span>`).join('')}</div></div><div class="stamp ${esc(i.status_key)}">${esc(i.status_label)}</div></header><nav class="tabs" aria-label="Issue sections"><button class="tab ${activeTab==='summary'?'active':''}" data-tab="summary">Summary</button><button class="tab ${activeTab==='assessment'?'active':''}" data-tab="assessment">Evidence</button><button class="tab ${activeTab==='timeline'?'active':''}" data-tab="timeline">History</button><button class="tab ${activeTab==='sources'?'active':''}" data-tab="sources">Sources</button></nav><section class="panel ${activeTab==='summary'?'active':''}" id="summary">${summary(i)}</section><section class="panel ${activeTab==='assessment'?'active':''}" id="assessment">${assessment(i)}</section><section class="panel ${activeTab==='timeline'?'active':''}" id="timeline">${timeline(i)}</section><section class="panel ${activeTab==='sources'?'active':''}" id="sources">${sources(i)}</section>`;document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.tab;renderDossier()}))}
    document.getElementById('search').addEventListener('input',e=>{searchTerm=e.target.value.trim().toLowerCase();const issues=filtered();if(!issues.some(i=>i.id===selectedId)&&issues.length)selectedId=issues[0].id;renderList();renderDossier()});
    document.getElementById('category').addEventListener('change',e=>{category=e.target.value;const issues=filtered();if(!issues.some(i=>i.id===selectedId)&&issues.length)selectedId=issues[0].id;renderList();renderDossier()});
    document.getElementById('homeSearch').addEventListener('input',e=>{homeSearchTerm=e.target.value.trim().toLowerCase();if(dataset)renderHome()});
    document.getElementById('homeCategory').addEventListener('change',e=>{homeCategory=e.target.value;if(dataset)renderHome()});
    document.getElementById('back').addEventListener('click',()=>showHome(true));
    window.addEventListener('popstate',()=>{if(dataset)route()});
    fetch('./data/issues.json').then(r=>{if(!r.ok)throw new Error(r.statusText);return r.json()}).then(d=>{dataset=d;document.getElementById('homeDate').textContent=`Updated ${d.generated_at}`;renderHome();route()}).catch(e=>{document.getElementById('homeList').innerHTML='<div class="home-empty">Issues could not be loaded.</div>';document.getElementById('issueList').innerHTML='<div class="empty-list">Record unavailable.</div>';document.getElementById('dossier').innerHTML=`<div class="blank">Could not load evidence: ${esc(e.message)}</div>`});
  </script>
</body>
</html>
