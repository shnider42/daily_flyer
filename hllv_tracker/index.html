<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A public evidence ledger for Hell Let Loose: Vietnam issues and community-server incidents.">
  <title>HLLV Issue Dossiers</title>
  <style>
    :root{--rail:#171a17;--rail-2:#20241f;--paper:#eee9db;--paper-2:#f7f3e9;--ink:#20231f;--muted:#686d65;--line:#c8c1b0;--olive:#526048;--olive-2:#768467;--red:#a74732;--amber:#b87d27;--green:#416c4c;--white:#f7f5ed}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}.app{min-height:100vh;display:grid;grid-template-columns:350px minmax(0,1fr)}button,input,select{font:inherit}
    .rail{position:sticky;top:0;height:100vh;background:var(--rail);color:var(--white);display:flex;flex-direction:column;border-right:7px solid var(--red);overflow:hidden}.rail-head{padding:24px 22px 18px;border-bottom:1px solid #343a33}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:42px;height:42px;border:2px solid #8f9d80;display:grid;place-items:center;font:900 .78rem/1 "Courier New",monospace;color:#c5d1b8}.brand strong{display:block;text-transform:uppercase;letter-spacing:.09em;font-size:.9rem}.brand span{display:block;color:#929a8e;font:.68rem/1.4 "Courier New",monospace;text-transform:uppercase;letter-spacing:.08em}.index-count{margin-top:18px;color:#b5bcae;font:.73rem "Courier New",monospace}.controls{padding:15px 15px 12px;border-bottom:1px solid #343a33}.search{width:100%;height:40px;background:#0f110f;border:1px solid #424940;border-radius:0;color:#f1f2ec;padding:0 11px;outline:none;font-size:.85rem}.search:focus{border-color:#9eab91}.search::placeholder{color:#737a70}.category{width:100%;height:34px;margin-top:8px;background:var(--rail-2);border:1px solid #424940;border-radius:0;color:#cdd2c8;padding:0 8px;font-size:.75rem}.issue-list{overflow:auto;padding:8px}.issue-button{width:100%;border:0;border-left:3px solid transparent;background:transparent;color:#d4d8cf;text-align:left;padding:12px 11px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 10px}.issue-button:hover{background:#20241f}.issue-button.active{background:#292e28;border-left-color:#d4a046}.issue-id{font:.65rem "Courier New",monospace;color:#828a7e;letter-spacing:.06em;text-transform:uppercase}.issue-title{display:block;font-size:.86rem;font-weight:700;line-height:1.25}.dot{width:8px;height:8px;border-radius:50%;background:#8a9485;margin-top:5px}.dot.testing{background:var(--amber)}.dot.investigating,.dot.partial{background:var(--red)}.dot.shipped{background:#679472}.empty-list{padding:20px 12px;color:#929a8e;font-size:.8rem}.rail-foot{margin-top:auto;padding:12px 20px;border-top:1px solid #343a33;color:#71786e;font:.63rem "Courier New",monospace;text-transform:uppercase;letter-spacing:.05em}
    .workspace{min-width:0;background:linear-gradient(rgba(75,78,68,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(75,78,68,.035) 1px,transparent 1px),var(--paper);background-size:24px 24px}.workspace-bar{height:65px;padding:0 34px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font:.7rem "Courier New",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.ledger-rule{color:var(--red);font-weight:700}.dossier{max-width:1020px;margin:0 auto;padding:42px 42px 70px}.case-head{display:grid;grid-template-columns:1fr auto;gap:30px;padding-bottom:24px;border-bottom:3px double var(--ink)}.case-label{font:.7rem "Courier New",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.case-head h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.35rem,5vw,4.6rem);letter-spacing:-.045em;line-height:.95;margin:9px 0 17px;max-width:760px}.scope{display:flex;flex-wrap:wrap;gap:6px}.scope span{padding:4px 7px;border:1px solid #afa897;background:rgba(255,255,255,.25);font:.67rem "Courier New",monospace;text-transform:uppercase}.stamp{align-self:start;border:3px solid currentColor;color:var(--red);padding:8px 10px;transform:rotate(2deg);font:900 .73rem "Courier New",monospace;text-transform:uppercase;letter-spacing:.08em;max-width:150px;text-align:center}.stamp.testing{color:var(--amber)}.stamp.shipped{color:var(--green)}.stamp.partial{color:#8b5934}
    .lead{display:grid;grid-template-columns:110px 1fr;gap:20px;padding:24px 0;border-bottom:1px solid var(--line)}.lead-label{font:.68rem "Courier New",monospace;color:var(--red);text-transform:uppercase;letter-spacing:.1em;font-weight:700}.lead p{margin:0;font:1.12rem/1.55 Georgia,"Times New Roman",serif}.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-top:25px}.tab{border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);padding:11px 17px 9px;cursor:pointer;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.tab:hover{color:var(--ink)}.tab.active{color:var(--ink);border-bottom-color:var(--red)}.panel{display:none;padding-top:26px}.panel.active{display:block}
    .assessment{display:grid;grid-template-columns:1fr 1fr;gap:28px 40px}.block{min-width:0}.block.full{grid-column:1/-1}.block h2{margin:0 0 10px;font:.68rem "Courier New",monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.block p{margin:0;font-size:.91rem;line-height:1.65}.fact-list{list-style:none;margin:0;padding:0}.fact-list li{position:relative;padding:8px 0 8px 20px;border-top:1px solid #d5cebd;font-size:.84rem;line-height:1.5}.fact-list li:before{position:absolute;left:0;font-family:"Courier New",monospace;font-weight:900}.known li:before{content:"+";color:var(--green)}.unknown li:before{content:"?";color:var(--red)}.workaround{border-left:4px solid var(--amber);background:rgba(255,255,255,.36);padding:15px 17px}.workaround h2{color:#8a5d1e}.none{color:#858a82;font-style:italic}
    .timeline{position:relative;margin-left:88px;border-left:1px solid #aaa392}.event{position:relative;padding:0 0 28px 26px}.event:last-child{padding-bottom:0}.event:before{content:"";position:absolute;left:-5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px var(--paper)}.event-date{position:absolute;right:calc(100% + 18px);top:0;width:80px;text-align:right;font:.68rem "Courier New",monospace;color:var(--muted)}.event h3{margin:0 0 4px;font-size:.9rem}.event p{margin:0;color:#5d625b;font-size:.84rem;line-height:1.55}.source-list{border-top:1px solid var(--ink)}.source-row{display:grid;grid-template-columns:100px minmax(160px,.7fr) 1.4fr auto;gap:16px;align-items:start;padding:15px 0;border-bottom:1px solid var(--line);font-size:.79rem}.source-date{font-family:"Courier New",monospace;color:var(--muted)}.source-title{font-weight:700}.source-claim{color:#5f645d}.source-link{color:var(--red);font-weight:800;text-decoration:none}.source-link:hover{text-decoration:underline}.blank{height:60vh;display:grid;place-items:center;color:var(--muted);font-family:"Courier New",monospace}
    @media(max-width:900px){.app{grid-template-columns:300px minmax(0,1fr)}.rail{border-right-width:5px}.dossier{padding:32px 28px 60px}.workspace-bar{padding:0 28px}.case-head{grid-template-columns:1fr}.stamp{position:absolute;right:28px;top:96px}.assessment{grid-template-columns:1fr}.block.full{grid-column:auto}.source-row{grid-template-columns:85px 1fr auto}.source-claim{grid-column:2/-1}}
    @media(max-width:680px){.app{display:block}.rail{position:relative;height:auto;border-right:0;border-bottom:5px solid var(--red)}.rail-head{padding:17px 16px 13px}.index-count,.rail-foot{display:none}.controls{padding:10px 12px;display:grid;grid-template-columns:1fr 135px;gap:8px}.category{height:40px;margin:0}.issue-list{display:flex;overflow:auto;padding:7px}.issue-button{min-width:210px;border-left:0;border-bottom:3px solid transparent}.issue-button.active{border-left:0;border-bottom-color:#d4a046}.workspace-bar{height:48px;padding:0 16px}.dossier{padding:24px 16px 50px}.case-head{gap:15px}.case-head h1{font-size:2.55rem;padding-right:0}.stamp{position:static;transform:none;max-width:none;justify-self:start}.lead{grid-template-columns:1fr;gap:7px;padding:18px 0}.tabs{overflow:auto}.tab{padding:10px 12px;white-space:nowrap}.assessment{gap:24px}.timeline{margin-left:72px}.event-date{width:66px}.source-row{grid-template-columns:1fr auto;gap:5px 12px}.source-date{grid-column:1}.source-title{grid-column:1}.source-claim{grid-column:1/-1}.source-link{grid-column:2;grid-row:1/3}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="rail-head"><div class="brand"><div class="brand-mark">H/V</div><div><strong>Issue Dossiers</strong><span>Public evidence index</span></div></div><div class="index-count" id="indexCount">Loading record…</div></div>
      <div class="controls"><input class="search" id="search" type="search" placeholder="Search dossiers" autocomplete="off" aria-label="Search dossiers"><select class="category" id="category" aria-label="Filter by category"><option value="all">All categories</option><option value="gameplay">Gameplay</option><option value="voip">VOIP</option><option value="stability">Stability</option><option value="map-collision">Map / collision</option><option value="community-server">Community server</option></select></div>
      <nav class="issue-list" id="issueList" aria-label="Issue dossiers"></nav>
      <div class="rail-foot">Unknown is valid · Evidence first</div>
    </aside>
    <main class="workspace">
      <div class="workspace-bar"><span>Hell Let Loose: Vietnam</span><span class="ledger-rule">Official ≠ reproduced ≠ resolved</span></div>
      <article class="dossier" id="dossier"><div class="blank">Loading dossier…</div></article>
    </main>
  </div>
  <script>
    let dataset,selectedId,searchTerm='',category='all',activeTab='assessment';
    const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    const human=s=>String(s??'').replaceAll('-',' ').replace(/\b\w/g,c=>c.toUpperCase());
    const searchable=i=>[i.id,i.title,i.category,i.kind,i.status_label,i.symptom,i.official_position,i.workaround,...i.scope,...i.known,...i.unknown].filter(Boolean).join(' ').toLowerCase();
    function filtered(){return dataset.issues.filter(i=>(category==='all'||i.category===category)&&(!searchTerm||searchable(i).includes(searchTerm)))}
    function renderList(){const issues=filtered();document.getElementById('indexCount').textContent=`${issues.length} of ${dataset.issues.length} dossiers · updated ${dataset.generated_at}`;document.getElementById('issueList').innerHTML=issues.length?issues.map(i=>`<button class="issue-button ${i.id===selectedId?'active':''}" data-id="${esc(i.id)}"><span><span class="issue-id">${esc(i.id)} · ${esc(human(i.category))}</span><span class="issue-title">${esc(i.title)}</span></span><span class="dot ${esc(i.status_key)}" aria-label="${esc(i.status_label)}"></span></button>`).join(''):'<div class="empty-list">No matching dossiers.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>selectIssue(b.dataset.id)))}
    function selectIssue(id){selectedId=id;activeTab='assessment';history.replaceState(null,'',`#${id}`);renderList();renderDossier();if(window.innerWidth<681)document.getElementById('dossier').scrollIntoView({behavior:'smooth'})}
    function list(items,cls){return `<ul class="fact-list ${cls}">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
    function assessment(i){return `<div class="assessment"><section class="block full"><h2>Official position</h2><p>${esc(i.official_position)}</p></section><section class="block"><h2>Established</h2>${list(i.known,'known')}</section><section class="block"><h2>Still unknown</h2>${list(i.unknown,'unknown')}</section><section class="block full workaround"><h2>Workaround</h2><p class="${i.workaround?'':'none'}">${esc(i.workaround||'No official workaround recorded.')}</p></section></div>`}
    function timeline(i){return `<div class="timeline">${i.timeline.map(e=>`<section class="event"><time class="event-date">${esc(e.date)}</time><h3>${esc(e.event)}</h3><p>${esc(e.detail)}</p></section>`).join('')}</div>`}
    function sources(i){return `<div class="source-list">${i.sources.map(s=>`<div class="source-row"><time class="source-date">${esc(s.date)}</time><div class="source-title">${esc(s.title)}<br><span class="issue-id">${esc(s.publisher)} · ${esc(s.type)}</span></div><div class="source-claim">${esc(s.claim)}</div><a class="source-link" href="${esc(s.url)}" target="_blank" rel="noreferrer">Open ↗</a></div>`).join('')}</div>`}
    function renderDossier(){const i=dataset.issues.find(x=>x.id===selectedId);if(!i){document.getElementById('dossier').innerHTML='<div class="blank">Select a dossier.</div>';return}document.title=`${i.id} · ${i.title}`;document.getElementById('dossier').innerHTML=`<header class="case-head"><div><div class="case-label">${esc(i.id)} · ${esc(i.kind)} · updated ${esc(i.last_updated)}</div><h1>${esc(i.title)}</h1><div class="scope">${i.scope.map(s=>`<span>${esc(s)}</span>`).join('')}</div></div><div class="stamp ${esc(i.status_key)}">${esc(i.status_label)}</div></header><section class="lead"><div class="lead-label">Observed</div><p>${esc(i.symptom)}</p></section><nav class="tabs" aria-label="Dossier sections"><button class="tab ${activeTab==='assessment'?'active':''}" data-tab="assessment">Assessment</button><button class="tab ${activeTab==='timeline'?'active':''}" data-tab="timeline">Timeline · ${i.timeline.length}</button><button class="tab ${activeTab==='sources'?'active':''}" data-tab="sources">Sources · ${i.sources.length}</button></nav><section class="panel ${activeTab==='assessment'?'active':''}" id="assessment">${assessment(i)}</section><section class="panel ${activeTab==='timeline'?'active':''}" id="timeline">${timeline(i)}</section><section class="panel ${activeTab==='sources'?'active':''}" id="sources">${sources(i)}</section>`;document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.tab;renderDossier()}))}
    document.getElementById('search').addEventListener('input',e=>{searchTerm=e.target.value.trim().toLowerCase();const issues=filtered();if(!issues.some(i=>i.id===selectedId)&&issues.length)selectedId=issues[0].id;renderList();renderDossier()});
    document.getElementById('category').addEventListener('change',e=>{category=e.target.value;const issues=filtered();if(!issues.some(i=>i.id===selectedId)&&issues.length)selectedId=issues[0].id;renderList();renderDossier()});
    fetch('./data/issues.json').then(r=>{if(!r.ok)throw new Error(r.statusText);return r.json()}).then(d=>{dataset=d;const hash=location.hash.slice(1);selectedId=d.issues.some(i=>i.id===hash)?hash:d.issues[0]?.id;renderList();renderDossier()}).catch(e=>{document.getElementById('issueList').innerHTML='<div class="empty-list">Record unavailable.</div>';document.getElementById('dossier').innerHTML=`<div class="blank">Could not load evidence: ${esc(e.message)}</div>`});
  </script>
</body>
</html>
