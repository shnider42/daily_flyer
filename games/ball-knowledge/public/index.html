<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141919">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Twelve questions. Fifteen seconds each. General trivia, rare knowledge, and a score worth defending. A Daily Flyer game.">
  <title>Ball Knowledge · Daily Flyer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to game</a>
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Ball Knowledge home" id="home-link"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17.5"/><path d="M20 2.5v35M2.5 20h35M7.6 7.6l24.8 24.8M7.6 32.4 32.4 7.6"/><circle cx="20" cy="20" r="7"/></svg><span>BALL<br>KNOWLEDGE</span></a>
    <nav class="header-nav" aria-label="Game tools">
      <button class="header-button" id="leaderboard-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-8h5v8M9 21V4h6v17M15 21V9h5v12M2 21h20"/></svg><span>Leaderboard</span></button>
      <button class="icon-button" id="sound-button" type="button" aria-label="Turn sound on" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 5-5 4H3v6h3l5 4V5ZM16 9l5 6m0-6-5 6"/></svg></button>
      <button class="icon-button help-button" id="help-button" type="button" aria-label="How to play">?</button>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <div class="loading-screen"><div class="loader" aria-hidden="true"></div><p>Opening the question book…</p></div>
  </main>
  <footer class="site-footer"><a href="https://dfe-directory.onrender.com/">A Daily Flyer game</a><button type="button" id="credits-button">Questions &amp; credits</button><span id="version-label"></span></footer>
  <div class="sr-only" id="announcer" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-shell"><header class="dialog-header"><h2 id="dialog-title"></h2><button class="icon-button" id="dialog-close" type="button" aria-label="Close dialog">×</button></header><div id="dialog-content"></div></div></dialog>
  <noscript><p class="noscript">Ball Knowledge needs JavaScript to run the quiz timer and submit answers.</p></noscript>
</body>
</html>
