name: HLLV moderator inbox
on:
  push:
    branches: [feature/hllv-bug-evidence-tracker]
    paths:
      - .github/hllv-inbox/**
      - .github/workflows/hllv-moderator-inbox.yml
permissions:
  contents: write
concurrency:
  group: hllv-reviewed-data-update
  cancel-in-progress: false
jobs:
  test-publish-verify:
    if: github.repository == 'shnider42/daily_flyer'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: inbox_fixture_only
          POSTGRES_DB: pilot_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d pilot_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PILOT_TEST_DATABASE_URL: postgresql://postgres:inbox_fixture_only@localhost:5432/pilot_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Prepare inbox without changing authentication or public intake
        run: |
          python3 -m py_compile .github/hllv-inbox/*.py
          python3 .github/hllv-inbox/apply.py
          node --check .github/hllv-inbox/inbox.js
          node --check .github/hllv-pilot/suggestions.js
          node --test .github/hllv-inbox/test_ui.cjs .github/hllv-password/test_ui.cjs .github/hllv-evidence/test_evidence.cjs
          git diff --check
      - name: Generate replay migration only; do not connect hosted database
        run: |
          npx --yes supabase@2.120.0 migration new --help
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('suggestion_box');files=list(root.glob('supabase/migrations/*_hllv_moderator_inbox.sql'))
          if not files:
              subprocess.run(['npx','--yes','supabase@2.120.0','migration','new','hllv_moderator_inbox'],cwd=root,check=True)
              files=list(root.glob('supabase/migrations/*_hllv_moderator_inbox.sql'))
          assert len(files)==1
          source=Path('.github/hllv-inbox/schema.sql').read_bytes()
          if files[0].stat().st_size:assert files[0].read_bytes()==source
          else:files[0].write_bytes(source)
          PY
      - name: Install isolated test dependencies
        run: |
          python3 -m pip install --quiet --disable-pip-version-check 'psycopg[binary]==3.2.10' playwright==1.55.0
          python3 -m playwright install --with-deps chromium webkit >/tmp/inbox-browsers.log 2>&1 || { tail -40 /tmp/inbox-browsers.log; exit 1; }
      - name: Verify base permissions and new inbox transitions in isolated database
        run: |
          python3 suggestion_box/tests/test_database.py
          python3 .github/hllv-inbox/test_database.py
      - name: Test the integrated site before publishing
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory hllv_tracker >/tmp/inbox-site.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          python3 .github/hllv-inbox/test_browser.py
          python3 .github/hllv-inbox/test_browser.py --engine webkit
          python3 .github/hllv-password/test_browser.py
          python3 .github/hllv-password/test_browser.py --engine webkit
          python3 .github/hllv-password/test_public.py
          python3 .github/hllv-evidence/test_browser.py
          python3 .github/hllv-evidence/test_browser.py --engine webkit
      - name: Publish only tested inbox files
        run: |
          set -euo pipefail
          git diff --check
          git add -- .github/hllv-pilot/suggestions.js .github/hllv-password/test_browser.py hllv_tracker/index.html hllv_tracker/data/issues.json hllv_tracker/data/issues.*.json hllv_tracker/assets hllv_tracker/deployment-manifest.json suggestion_box/supabase/migrations/*_hllv_moderator_inbox.sql
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish moderator inbox with clear real/practice separation and guarded decisions'
            git push origin HEAD:refs/heads/feature/hllv-bug-evidence-tracker
          fi
          echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)"
      - name: Verify ordinary production page and actual referenced assets
        run: |
          python3 -u - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import json,time
          root=Path('hllv_tracker');manifest=json.loads((root/'deployment-manifest.json').read_text());paths=['','index.html']+manifest['files'];last='Not checked'
          for attempt in range(60):
              try:
                  for path in paths:
                      with urlopen('https://hllv-bug-track.onrender.com/'+path,timeout=15) as r:actual=r.read()
                      assert actual==(root/(path.split('?')[0] or 'index.html')).read_bytes(),'Mismatch: '+(path or '/')
                  print('PRODUCTION_EXACT_MATCH: ordinary homepage and referenced files');break
              except Exception as error:
                  last=str(error)
                  if attempt%6==0:print(last)
              time.sleep(5)
          else:raise RuntimeError(last)
          PY
          python3 .github/hllv-inbox/test_browser.py --url https://hllv-bug-track.onrender.com/
          python3 .github/hllv-inbox/test_browser.py --url https://hllv-bug-track.onrender.com/ --engine webkit
          python3 .github/hllv-password/test_public.py --url https://hllv-bug-track.onrender.com/
          python3 .github/hllv-evidence/test_browser.py --url https://hllv-bug-track.onrender.com/
      - name: Record verification scope
        run: |
          echo "Verified commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Moderator inbox installed. Phase remains setup; public intake and voting stay closed. Password/session and practice modules preserved. Base/inbox SQL tests and integrated Chromium/WebKit fixtures passed. Live anonymous private reads/writes denied. Real people did not submit, log in or receive emails during automated tests. This is not a completed multi-person review pilot.' >> "$GITHUB_STEP_SUMMARY"
