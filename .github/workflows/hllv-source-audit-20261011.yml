name: HLLV October 11 source audit
on:
  push:
    branches: [feature/hllv-bug-evidence-tracker]
    paths: [.github/workflows/hllv-source-audit-20261011.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inspect public tracker sources without changing the site
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, html, json, re, urllib.request, urllib.error, zipfile
          from pathlib import Path
          from urllib.parse import urlsplit
          from datetime import datetime, timezone
          root=Path('hllv_tracker'); data=json.loads((root/'data/issues.json').read_text()); out=Path('source-audit');out.mkdir()
          print('DATA_KEYS',list(data))
          print('ISSUE_SUMMARY',json.dumps([{k:i.get(k) for k in ['id','title','status_key','last_updated','bottom_line']} for i in data['issues']],ensure_ascii=False))
          print('DATA_TAIL',json.dumps({k:v for k,v in data.items() if k not in ['issues','incidents']},ensure_ascii=False)[:18000])
          sources={s['url']:s for i in data['issues'] for s in i['sources']}
          allowed={'www.hellletloose.com','hellletloose.com','steamcommunity.com','store.steampowered.com','api.steampowered.com','www.reddit.com','reddit.com'}
          def fetch(url):
              assert urlsplit(url).scheme=='https' and urlsplit(url).hostname in allowed
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 HLLV-Evidence-Review','Accept-Language':'en'})
              with urllib.request.urlopen(req,timeout=18) as r:
                  raw=r.read(8000001)
                  assert len(raw)<=8000000
                  assert urlsplit(r.url).hostname in allowed
                  return r.status,r.url,raw
          def audit(url):
              result={'url':url,'checked_at':datetime.now(timezone.utc).isoformat()}
              try:
                  code,final,raw=fetch(url)
                  body=raw.decode('utf-8',errors='replace')
                  title=re.search(r'<title[^>]*>(.*?)</title>',body,re.S|re.I)
                  result.update(http_status=code,final_url=final,title=html.unescape(re.sub('<[^>]+>',' ',title[1])).strip() if title else '')
                  (out/(hashlib.sha256(url.encode()).hexdigest()[:16]+'.html')).write_bytes(raw)
              except urllib.error.HTTPError as e:result.update(http_status=e.code,error='HTTP '+str(e.code))
              except Exception as e:result.update(http_status=None,error=str(e))
              return result
          extra=['https://www.hellletloose.com/blog/community-update-7','https://www.hellletloose.com/blog','https://steamcommunity.com/app/3079210/allnews/']
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool: results=list(pool.map(audit,sorted(set(sources)|set(extra))))
          (out/'links.json').write_text(json.dumps(results,indent=2))
          print('LINK_AUDIT',json.dumps(results,ensure_ascii=False))
          url='https://api.steampowered.com/ISteamNews/GetNewsForApp/v0002/?appid=3079210&count=100&maxlength=0'
          try:
              _,_,raw=fetch(url);news=json.loads(raw);(out/'steam-news.json').write_bytes(raw)
              print('STEAM_NEWS',json.dumps([{k:n.get(k) for k in ['title','url','date','feedname','is_external_url']} for n in news['appnews']['newsitems'][:20]],ensure_ascii=False))
          except Exception as e: print('STEAM_NEWS_LIMITATION',str(e))
          with zipfile.ZipFile('hllv-review-inputs.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in [root,Path('source-audit')]+sorted(Path('.github').glob('hllv-*')):
                  if folder.is_dir():
                      for p in folder.rglob('*'):
                          if p.is_file():z.write(p,str(p))
          print('READ_ONLY_AUDIT_COMPLETE: no website, authentication, database or moderation writes')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hllv-review-inputs-20261011
          path: hllv-review-inputs.zip
          retention-days: 3
          if-no-files-found: error
