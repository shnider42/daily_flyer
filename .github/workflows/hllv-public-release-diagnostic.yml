name: HLLV public release diagnostics
on:
  push:
    branches: [feature/hllv-bug-evidence-tracker]
    paths: [.github/workflows/hllv-public-release-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compare public page fingerprints and source endpoints only
        run: |
          python3 - <<'PY'
          import hashlib,json,re,urllib.request,urllib.error,difflib
          from pathlib import Path
          root=Path('hllv_tracker')
          for path in ['','index.html','deployment-manifest.json','official-feed.json']:
              expected=(root/(path or 'index.html')).read_bytes()
              try:
                  with urllib.request.urlopen('https://hllv-bug-track.onrender.com/'+path,timeout=20) as response:
                      actual=response.read(8000001)
                      headers={k:v for k,v in response.headers.items() if k.lower() in ['etag','last-modified','age','cache-control','content-type','cf-cache-status','x-render-origin-server','date','server']}
                  result={'path':path or '/','expected_sha256':hashlib.sha256(expected).hexdigest(),'actual_sha256':hashlib.sha256(actual).hexdigest(),'exact_match':actual==expected,'bytes':len(actual),'headers':headers}
                  if path in ['', 'index.html']:
                      text=actual.decode('utf-8','replace')
                      result['title']=re.findall(r'<title>(.*?)</title>',text)
                      result['theme']=re.findall(r'<html[^>]*>',text)
                      result['has_source_display']='id="officialSourceUpdates"' in text
                      result['data_urls']=re.findall(r'const TRACKER_DATA_URL = ([^;]+)',text)
                      result['script_urls']=re.findall(r'<script[^>]*src="([^"]+)"',text)
                      result['first_differences']=list(difflib.unified_diff(expected.decode().splitlines(),text.splitlines(),n=1))[:16]
                  else:
                      value=json.loads(actual)
                      result['public_metadata']={k:value[k] for k in ['data_url','data_sha256','last_success_at','last_attempt_at','state','schema_version'] if k in value}
                  print(json.dumps(result))
              except Exception as error:
                  print(json.dumps({'path':path or '/','error':str(error)}))
          print('READ_ONLY: no authentication, accounts, settings, private records or deployment writes')
          PY
