name: HLLV interface workbench inputs
# Source snapshot for the approved Type emphasis and temporary moderator work.
on:
  push:
    branches: [feature/hllv-bug-evidence-tracker]
    paths: [.github/workflows/hllv-workbench-20261012.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Package tracked source files only
        run: |
          python3 - <<'PY'
          import subprocess, zipfile
          from pathlib import Path
          paths=subprocess.check_output(['git','ls-files','hllv_tracker','.github','suggestion_box'],text=True).splitlines()
          with zipfile.ZipFile('hllv-workbench-inputs.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in paths:
                  p=Path(name)
                  if p.is_file():z.write(p,name)
          print('Packaged tracked source, not private database data.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hllv-workbench-inputs
          path: hllv-workbench-inputs.zip
          retention-days: 3
