name: HLLV existing-account password sign-in
on:
  push:
    branches: [feature/hllv-bug-evidence-tracker]
    paths:
      - .github/hllv-password/**
      - .github/workflows/hllv-password-sign-in.yml
permissions:
  contents: write
concurrency:
  group: hllv-reviewed-data-update
  cancel-in-progress: false
jobs:
  test-publish-verify:
    if: github.repository == 'shnider42/daily_flyer'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Prepare account UI without changing hosted users or policies
        run: |
          python3 -m py_compile .github/hllv-password/*.py
          python3 .github/hllv-password/apply.py
          node --check .github/hllv-pilot/suggestions.js
          node --check .github/hllv-password/password.js
          node --test .github/hllv-password/test_ui.cjs .github/hllv-evidence/test_evidence.cjs
          git diff --check
      - name: Install isolated browser dependencies
        run: |
          python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium webkit >/tmp/hllv-auth-browsers.log 2>&1 || { tail -40 /tmp/hllv-auth-browsers.log; exit 1; }
      - name: Verify local tracker before publication
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory hllv_tracker >/tmp/hllv-auth-site.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          python3 .github/hllv-password/test_browser.py
          python3 .github/hllv-password/test_browser.py --engine webkit
          python3 .github/hllv-password/test_public.py
          python3 .github/hllv-password/test_public.py --engine webkit
          python3 .github/hllv-evidence/test_browser.py
          python3 .github/hllv-evidence/test_browser.py --engine webkit
      - name: Publish only the tested account interface
        run: |
          set -euo pipefail
          git diff --check
          git add -- .github/hllv-pilot/suggestions.js hllv_tracker/index.html hllv_tracker/data/issues.json hllv_tracker/data/issues.*.json hllv_tracker/assets hllv_tracker/deployment-manifest.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Add existing-account password sign-in and opt-in cross-tab sessions'
            git push origin HEAD:refs/heads/feature/hllv-bug-evidence-tracker
          fi
          echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)"
      - name: Verify production page and exact referenced files
        run: |
          python3 -u - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          root=Path('hllv_tracker');manifest=json.loads((root/'deployment-manifest.json').read_text())
          paths=['','index.html']+manifest['files'];last='Not checked'
          for attempt in range(60):
              try:
                  for path in paths:
                      with urllib.request.urlopen('https://hllv-bug-track.onrender.com/'+path,timeout=15) as r:actual=r.read()
                      assert actual==(root/(path.split('?')[0] or 'index.html')).read_bytes(),'Mismatch: '+(path or '/')
                  print('PRODUCTION_EXACT_MATCH: ordinary homepage and actual account assets');break
              except Exception as error:
                  last=str(error)
                  if attempt%6==0:print(last)
              time.sleep(5)
          else:raise RuntimeError(last)
          PY
          python3 .github/hllv-password/test_browser.py --url https://hllv-bug-track.onrender.com/
          python3 .github/hllv-password/test_browser.py --url https://hllv-bug-track.onrender.com/ --engine webkit
          python3 .github/hllv-password/test_public.py --url https://hllv-bug-track.onrender.com/
          python3 .github/hllv-evidence/test_browser.py --url https://hllv-bug-track.onrender.com/
      - name: Record verification boundary
        run: |
          echo "Verified interface commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Existing-account password UI, account strip and session options tested. Password setup/login tests use isolated identities and simulated Auth responses. Real SDK/public boundary smoke tests send no mail or credentials. No hosted account, password, role, pilot phase, approval or game evidence was changed by this workflow. Owner password setup and real password login remain the final user check.' >> "$GITHUB_STEP_SUMMARY"
