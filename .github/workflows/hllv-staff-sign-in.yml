name: HLLV staff sign-in setup
on:
  push:
    branches: [feature/hllv-bug-evidence-tracker]
    paths:
      - .github/hllv-operator/**
      - .github/workflows/hllv-staff-sign-in.yml
permissions:
  contents: write
concurrency:
  group: hllv-reviewed-data-update
  cancel-in-progress: false
jobs:
  test-publish-verify:
    if: github.repository == 'shnider42/daily_flyer'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Prepare staff-only sign-in without changing evidence or database
        run: |
          python3 -m py_compile .github/hllv-operator/*.py
          python3 .github/hllv-operator/apply.py
          node --check .github/hllv-pilot/suggestions.js
          node --test .github/hllv-operator/test_operator.cjs .github/hllv-pilot/test_ui.cjs .github/hllv-connection/test_connection.cjs .github/hllv-evidence/test_evidence.cjs
          git diff --check
      - name: Install isolated browser tests
        run: |
          python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium webkit >/tmp/hllv-install.log 2>&1 || { tail -40 /tmp/hllv-install.log; exit 1; }
      - name: Test before publication
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory hllv_tracker >/tmp/hllv-site.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          python3 .github/hllv-operator/test_operator.py
          python3 .github/hllv-operator/test_operator.py --engine webkit
          python3 .github/hllv-pilot/test_browser.py
          python3 .github/hllv-pilot/test_browser.py --engine webkit
          python3 .github/hllv-evidence/test_browser.py
          python3 .github/hllv-evidence/test_browser.py --engine webkit
      - name: Publish only tested tracker files
        run: |
          set -euo pipefail
          git diff --check
          git add -- .github/hllv-pilot/suggestions.js .github/hllv-pilot/test_browser.py hllv_tracker/index.html hllv_tracker/data/issues.json hllv_tracker/data/issues.*.json hllv_tracker/assets hllv_tracker/suggestions-config.json hllv_tracker/deployment-manifest.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Enable staff email sign-in and read-only Review desk without opening pilot intake'
            git push origin HEAD:refs/heads/feature/hllv-bug-evidence-tracker
          fi
          echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)"
      - name: Verify normal homepage and exact application files
        run: |
          python3 -u - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          root=Path('hllv_tracker');manifest=json.loads((root/'deployment-manifest.json').read_text())
          paths=['','index.html']+manifest['files'];last='No response'
          for attempt in range(60):
              try:
                  for path in paths:
                      with urllib.request.urlopen('https://hllv-bug-track.onrender.com/'+path,timeout=15) as r: actual=r.read()
                      assert actual==(root/(path.split('?')[0] or 'index.html')).read_bytes(), 'Mismatch: '+(path or '/')
                  print('PRODUCTION_EXACT_MATCH: ordinary homepage and referenced files')
                  break
              except Exception as error:
                  last=str(error)
                  if attempt%6==0: print(last)
              time.sleep(5)
          else: raise RuntimeError(last)
          PY
          python3 .github/hllv-operator/test_operator.py --url https://hllv-bug-track.onrender.com/
          python3 .github/hllv-operator/test_operator.py --url https://hllv-bug-track.onrender.com/ --engine webkit
          python3 .github/hllv-evidence/test_browser.py --url https://hllv-bug-track.onrender.com/
      - name: Record release boundary
        run: |
          echo "Verified commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Staff-only sign-in and read-only Review desk are available. Real hosted public boundary probes and Chromium/WebKit checks passed. No database permissions, reviewer authority, participant settings or game evidence changed. No real email was requested by tests; real inbox sign-in is the remaining user check.' >> "$GITHUB_STEP_SUMMARY"
