name: HLLV private moderator practice
on:
  push:
    branches: [feature/hllv-bug-evidence-tracker]
    paths:
      - .github/hllv-rehearsal/**
      - .github/workflows/hllv-private-practice.yml
permissions:
  contents: write
concurrency:
  group: hllv-reviewed-data-update
  cancel-in-progress: false
jobs:
  test-publish-verify:
    if: github.repository == 'shnider42/daily_flyer'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: practice_fixture_only
          POSTGRES_DB: pilot_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d pilot_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PILOT_TEST_DATABASE_URL: postgresql://postgres:practice_fixture_only@localhost:5432/pilot_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Prepare isolated practice integration
        run: |
          python3 -m py_compile .github/hllv-rehearsal/*.py
          python3 .github/hllv-rehearsal/install.py
          node --check .github/hllv-rehearsal/practice.js
          node --check .github/hllv-pilot/suggestions.js
          node --test .github/hllv-rehearsal/test_ui.cjs .github/hllv-operator/test_operator.cjs .github/hllv-pilot/test_ui.cjs .github/hllv-connection/test_connection.cjs .github/hllv-evidence/test_evidence.cjs
          git diff --check
      - name: Generate replay migration with pinned CLI; never connect a hosted database
        run: |
          npx --yes supabase@2.120.0 --version
          npx --yes supabase@2.120.0 migration --help
          npx --yes supabase@2.120.0 migration new --help
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('suggestion_box')
          found=list(root.glob('supabase/migrations/*_hllv_private_moderator_rehearsal.sql'))
          if not found:
              subprocess.run(['npx','--yes','supabase@2.120.0','migration','new','hllv_private_moderator_rehearsal'],cwd=root,check=True)
              found=list(root.glob('supabase/migrations/*_hllv_private_moderator_rehearsal.sql'))
          assert len(found)==1
          source=Path('.github/hllv-rehearsal/schema.sql').read_bytes()
          if found[0].stat().st_size: assert found[0].read_bytes()==source
          else: found[0].write_bytes(source)
          print('REPLAY_MIGRATION',found[0])
          PY
      - name: Install isolated test dependencies
        run: |
          python3 -m pip install --quiet --disable-pip-version-check 'psycopg[binary]==3.2.10' playwright==1.55.0
          python3 -m playwright install --with-deps chromium webkit >/tmp/hllv-practice-browsers.log 2>&1 || { tail -40 /tmp/hllv-practice-browsers.log; exit 1; }
      - name: Verify existing workflow and isolated practice database rules
        run: |
          python3 suggestion_box/tests/test_database.py
          python3 .github/hllv-rehearsal/test_database.py
      - name: Verify browsers before publication
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory hllv_tracker >/tmp/hllv-practice-site.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          python3 .github/hllv-rehearsal/test_browser.py
          python3 .github/hllv-rehearsal/test_browser.py --engine webkit
          python3 .github/hllv-operator/test_operator.py
          python3 .github/hllv-operator/test_operator.py --engine webkit
          python3 .github/hllv-pilot/test_browser.py
          python3 .github/hllv-evidence/test_browser.py
          python3 .github/hllv-evidence/test_browser.py --engine webkit
      - name: Publish only tested practice integration
        run: |
          set -euo pipefail
          git diff --check
          git add -- .github/hllv-pilot/suggestions.js hllv_tracker/index.html hllv_tracker/data/issues.json hllv_tracker/data/issues.*.json hllv_tracker/assets hllv_tracker/deployment-manifest.json suggestion_box/PRIVATE_PRACTICE.md suggestion_box/supabase/migrations/*_hllv_private_moderator_rehearsal.sql
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Add private moderator practice without opening public intake or changing login'
            git push origin HEAD:refs/heads/feature/hllv-bug-evidence-tracker
          fi
          echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)"
      - name: Verify ordinary live homepage and referenced files
        run: |
          python3 -u - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          root=Path('hllv_tracker');manifest=json.loads((root/'deployment-manifest.json').read_text());paths=['','index.html']+manifest['files'];last='Not checked'
          for attempt in range(60):
              try:
                  for path in paths:
                      with urllib.request.urlopen('https://hllv-bug-track.onrender.com/'+path,timeout=15) as r:actual=r.read()
                      assert actual==(root/(path.split('?')[0] or 'index.html')).read_bytes(),'Mismatch: '+(path or '/')
                  print('PRODUCTION_EXACT_MATCH: ordinary homepage and all referenced assets');break
              except Exception as error:
                  last=str(error)
                  if attempt%6==0:print(last)
              time.sleep(5)
          else:raise RuntimeError(last)
          PY
          python3 .github/hllv-rehearsal/test_browser.py --url https://hllv-bug-track.onrender.com/
          python3 .github/hllv-rehearsal/test_browser.py --url https://hllv-bug-track.onrender.com/ --engine webkit
          python3 .github/hllv-operator/test_operator.py --url https://hllv-bug-track.onrender.com/
          python3 .github/hllv-evidence/test_browser.py --url https://hllv-bug-track.onrender.com/
      - name: Record release boundary
        run: |
          echo "Verified commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Private moderator practice only. Original login configuration, real intake, approvals, public board and evidence preserved. New practice SQL rules tested on isolated PostgreSQL; hosted API anonymous access denied. Chromium/WebKit fixtures exercised practice without real emails, account tokens or submissions. No full Team17 review pilot is claimed.' >> "$GITHUB_STEP_SUMMARY"
