name: HLLV submission conversations
on:
  push:
    branches: [feature/hllv-bug-evidence-tracker]
    paths: [.github/hllv-submission-threads/**, .github/workflows/hllv-submission-threads.yml]
permissions:
  contents: write
concurrency:
  group: hllv-reviewed-data-update
  cancel-in-progress: false
jobs:
  test-publish-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: conversation_fixture_only
          POSTGRES_DB: community_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d community_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COMMUNITY_TEST_DATABASE_URL: postgresql://postgres:conversation_fixture_only@localhost:5432/community_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Integrate private conversation and explicit public comments
        id: mode
        run: |
          python3 .github/hllv-submission-threads/install.py
          python3 .github/hllv-submission-threads/fixture.py
          node --check .github/hllv-community/app.js
          node --check .github/hllv-submission-threads/thread.js
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          print('publish='+str(json.loads(Path('.github/hllv-submission-threads/release.json').read_text())['publish']).lower())
          PY
      - name: Install isolated test dependencies
        run: |
          python3 -m pip install --quiet 'psycopg[binary]==3.2.10' playwright==1.55.0
          python3 -m playwright install --with-deps chromium webkit >/tmp/thread-browsers.log 2>&1 || { tail -40 /tmp/thread-browsers.log; exit 1; }
      - name: Test message privacy publication concurrency history and existing quotas
        run: python3 .github/hllv-submission-threads/test_database.py
      - name: Test real interface with synthetic member and moderator responses
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory hllv_tracker >/tmp/thread-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          python3 .github/hllv-submission-threads/test_browser.py
          python3 .github/hllv-submission-threads/test_browser.py --engine webkit
          python3 .github/hllv-member-registration/test_browser.py
          python3 .github/hllv-member-registration/test_browser.py --engine webkit
          node .github/hllv-evidence/test_evidence.cjs
      - name: Verify hosted endpoint exists without credentials or private data
        if: steps.mode.outputs.publish == 'true'
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          from pathlib import Path
          cfg=json.loads(Path('hllv_tracker/suggestions-config.json').read_text())
          req=urllib.request.Request(cfg['supabase_url']+'/rest/v1/rpc/hllv_submission_thread',data=json.dumps({'action':'read','payload':{}}).encode(),headers={'apikey':cfg['publishable_key'],'Content-Type':'application/json'})
          try:urllib.request.urlopen(req,timeout=20);raise AssertionError('Anonymous private thread request must be rejected')
          except urllib.error.HTTPError as e:
              data=json.load(e);assert data.get('code')=='42501',data
          print('Hosted conversation endpoint exists and denies anonymous private requests.')
          PY
      - name: Record verified hosted migration
        if: steps.mode.outputs.publish == 'true'
        run: |
          npx --yes supabase@2.120.0 migration new --help >/dev/null
          python3 - <<'PY'
          import json,subprocess,re
          from pathlib import Path
          root=Path('suggestion_box');cfg=json.loads(Path('.github/hllv-submission-threads/release.json').read_text());version=cfg['hosted_version'];assert re.fullmatch(r'[0-9]{14}',version)
          subprocess.run(['npx','--yes','supabase@2.120.0','migration','new','hllv_submission_conversations'],cwd=root,check=True)
          files=list(root.glob('supabase/migrations/*_hllv_submission_conversations.sql'));assert len(files)==1
          target=files[0].with_name(version+'_hllv_submission_conversations.sql');files[0].rename(target);target.write_bytes(Path('.github/hllv-submission-threads/schema.sql').read_bytes())
          PY
      - name: Publish tested conversation interface
        if: steps.mode.outputs.publish == 'true'
        run: |
          git add -- .github/hllv-community/app.js .github/hllv-community/test_browser.py hllv_tracker/index.html hllv_tracker/assets hllv_tracker/data/issues.json hllv_tracker/data/issues.*.json hllv_tracker/deployment-manifest.json hllv_tracker/reviews/submission-threads.json suggestion_box/supabase/migrations/*_hllv_submission_conversations.sql
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish private submission conversations and explicit public moderator comments'
          git push origin HEAD:refs/heads/feature/hllv-bug-evidence-tracker
          echo "Published $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify ordinary production URLs and deployed conversations
        if: steps.mode.outputs.publish == 'true'
        run: |
          python3 -u - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          root=Path('hllv_tracker');paths=['','index.html']+json.loads((root/'deployment-manifest.json').read_text())['files'];last='Not checked'
          for attempt in range(120):
              try:
                  for path in paths:
                      with urllib.request.urlopen('https://hllv-bug-track.onrender.com/'+path,timeout=15) as r:actual=r.read()
                      assert actual==(root/(path.split('?')[0] or 'index.html')).read_bytes(),'Mismatch: '+(path or '/')
                  print('PRODUCTION_EXACT_MATCH');break
              except Exception as e:
                  last=str(e)
                  if attempt%12==0:print(last)
              time.sleep(5)
          else:raise RuntimeError(last)
          PY
          python3 .github/hllv-submission-threads/test_browser.py --url https://hllv-bug-track.onrender.com/
          python3 .github/hllv-submission-threads/test_browser.py --url https://hllv-bug-track.onrender.com/ --engine webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: submission-conversation-previews
          path: artifacts/
          retention-days: 3
      - name: Record verification scope
        run: echo 'Browser scenarios use synthetic accounts and intercepted writes; database reset fixtures are localhost only. No real emails, submissions or votes created by this workflow.' >> "$GITHUB_STEP_SUMMARY"
