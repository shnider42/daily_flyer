name: One-time HLLV evidence review 2026-10-05
on:
  push:
    branches: [feature/hllv-bug-evidence-tracker]
    paths:
      - .github/workflows/hllv-review-20261005.yml
      - .github/scripts/hllv_review_20261005.py
permissions:
  contents: write
concurrency:
  group: hllv-reviewed-data-update
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'shnider42/daily_flyer'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Apply the reviewed snapshot and validate it
        run: python3 .github/scripts/hllv_review_20261005.py
      - name: Commit only the reviewed tracker files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- hllv_tracker/data/issues.json hllv_tracker/README.md; then
            echo 'No data changes to publish.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- hllv_tracker/data/issues.json hllv_tracker/README.md
          git commit -m 'Review HLLV evidence through October 5 and repair verified source links'
          git push origin HEAD:refs/heads/feature/hllv-bug-evidence-tracker
          echo "Published commit: $(git rev-parse HEAD)"
