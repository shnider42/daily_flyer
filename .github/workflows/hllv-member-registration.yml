name: HLLV Member registration
on:
  push:
    branches: [feature/hllv-bug-evidence-tracker]
    paths: [.github/hllv-member-registration/**, .github/workflows/hllv-member-registration.yml]
permissions:
  contents: write
concurrency:
  group: hllv-reviewed-data-update
  cancel-in-progress: false
jobs:
  test-publish-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: member_fixture_only
          POSTGRES_DB: community_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d community_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COMMUNITY_TEST_DATABASE_URL: postgresql://postgres:member_fixture_only@localhost:5432/community_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Install registration presentation only
        run: |
          python3 -m py_compile .github/hllv-member-registration/*.py
          python3 .github/hllv-member-registration/install.py
          node --check .github/hllv-member-registration/registration.js
          node --check .github/hllv-password/password.js
          node --check .github/hllv-community/app.js
          git diff --check
      - name: Install isolated test dependencies
        run: |
          python3 -m pip install --quiet 'psycopg[binary]==3.2.10' playwright==1.55.0
          python3 -m playwright install --with-deps chromium webkit >/tmp/member-browsers.log 2>&1 || { tail -40 /tmp/member-browsers.log; exit 1; }
      - name: Verify member isolation moderator quotas and voting in disposable database
        run: python3 .github/hllv-moderator-quota/test_database.py
      - name: Verify signup confirmation errors and existing journeys in both browsers
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory hllv_tracker >/tmp/member-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          python3 .github/hllv-member-registration/test_browser.py
          python3 .github/hllv-member-registration/test_browser.py --engine webkit
          python3 .github/hllv-ux-20261012/test_browser.py
          python3 .github/hllv-ux-20261012/test_browser.py --engine webkit
          python3 .github/hllv-password/test_browser.py --standalone
          python3 .github/hllv-password/test_browser.py --standalone --engine webkit
          node .github/hllv-password/test_ui.cjs
          node .github/hllv-evidence/test_evidence.cjs
      - name: Verify hosted public Auth configuration without creating users or sending emails
        run: |
          python3 .github/hllv-member-registration/verify_settings.py
          python3 .github/hllv-community/test_public.py
      - name: Publish tested registration UI to tracker branch
        run: |
          set -euo pipefail
          git add -- .github/hllv-password/password.js .github/hllv-community/app.js .github/hllv-community/section.html hllv_tracker/index.html hllv_tracker/assets hllv_tracker/data/issues.json hllv_tracker/data/issues.*.json hllv_tracker/suggestions-config.json hllv_tracker/deployment-manifest.json hllv_tracker/reviews/member-registration.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add self-service Member signup with email verification and unchanged moderator authority'
          git push origin HEAD:refs/heads/feature/hllv-bug-evidence-tracker
          echo "Published $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify ordinary live URLs and deployed registration journeys
        run: |
          python3 -u .github/hllv-member-registration/verify_production.py
          python3 .github/hllv-member-registration/test_browser.py --url https://hllv-bug-track.onrender.com/
          python3 .github/hllv-member-registration/test_browser.py --url https://hllv-bug-track.onrender.com/ --engine webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: member-registration-previews
          path: artifacts/
          retention-days: 3
      - name: Record exact verification scope
        run: |
          echo 'Verified ordinary production files, synthetic signup/confirmation flows in Chromium and WebKit, existing password/session flows, and isolated member/moderator authorization. No real signup email, credential or account was created by tests. Recipient email delivery remains unverified.' >> "$GITHUB_STEP_SUMMARY"
