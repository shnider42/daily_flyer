name: DSL final three-theater gate
on:
  push:
    branches: [agent/dsl-three-theaters-20261003]
    paths: [.github/workflows/dsl-theaters-final.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      DSL_SCREENSHOTS: /tmp/dsl-final/screenshots
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact follow-up patch
        run: |
          set -euo pipefail
          mkdir -p /tmp/dsl-final
          python - <<'PY'
          import base64,hashlib,zlib
          from pathlib import Path
          data=zlib.decompress(base64.b64decode(''.join(Path(f'_dsl-review/final.part{i}').read_text().strip() for i in (1,2)),validate=True))
          assert hashlib.sha256(data).hexdigest()=='982a0dee7bcd4d4861a4f0b7797104d111914a12928514ac0137eb9717b25e48'
          Path('/tmp/final.patch').write_bytes(data)
          PY
          git apply --index /tmp/final.patch
          git diff --cached --check
      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements-ww2.txt
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          echo "CHROMIUM_EXECUTABLE_PATH=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Actual browser suites with enforced exit codes
        run: |
          set -euo pipefail
          failed=0
          for suite in ww2-new-fronts-browser ww2-experience-browser ww2-front-replay-browser ww2-fubar-browser ww2-retained-map-browser ww2-map-performance-browser ww2-playback-browser ww2-replay-transport; do
            if node "tests/$suite.cjs" 2>&1 | tee "/tmp/dsl-final/$suite.log"; then
              echo "$suite PASS" | tee -a /tmp/dsl-final/browser-status.txt
            else
              echo "$suite FAIL" | tee -a /tmp/dsl-final/browser-status.txt
              failed=1
            fi
          done
          exit "$failed"
      - name: Full Python suite with enforced exit code
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_ww2*.py' -v 2>&1 | tee /tmp/dsl-final/python.log
      - name: Commit tested files to review branch only
        run: |
          set -euo pipefail
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Verify three-theater controls, Experience levels and historical replay scores [skip ci]'
          git rev-parse HEAD > /tmp/dsl-final/tested-commit.txt
          git ls-tree -r HEAD > /tmp/dsl-final/tested-tree.txt
          git diff --name-only d304cd1530fd3beaa0346a0f8d8e323857b7683b HEAD -- ww2_tactics tests docs ww2_web.py > /tmp/dsl-final/tested-paths.txt
          git push origin HEAD:refs/heads/agent/dsl-three-theaters-20261003
      - name: Preserve actual diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsl-final-validation
          path: /tmp/dsl-final
          retention-days: 3
