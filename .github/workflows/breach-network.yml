name: BREACH networking regression checks
on:
  push:
    branches: [qa/breach-network-recovery, feat/breach-fps]
    paths:
      - 'daily_flyer/themes/breach*'
      - 'daily_flyer/themes/breach_assets/**'
      - 'server/breach-*.mjs'
      - 'tests/breach-*.test.mjs'
      - 'scripts/breach-*.mjs'
      - 'package*.json'
      - '.github/workflows/breach-network.yml'
permissions:
  contents: read
concurrency:
  group: breach-network-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run test:breach
      - run: python -m unittest discover -s tests -p test_breach_export.py
      - run: python scripts/build_breach.py
      - name: Install browser test tooling
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser connection recovery and phone layouts
        run: node scripts/breach-network-browser.mjs
      - name: Switchyard and safe touch controls
        run: node scripts/breach-switchyard-browser.mjs
      - name: Glasshouse co-op weapons and phone inventory
        run: node scripts/breach-glasshouse-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breach-network-results
          path: |
            breach-network-results/
            breach-switchyard-results/
            breach-glasshouse-results/
          retention-days: 7

