name: HLLV Type clarity
on:
  push:
    branches: [feature/hllv-bug-evidence-tracker]
    paths: [.github/hllv-type-emphasis/**, .github/workflows/hllv-type-emphasis.yml]
permissions:
  contents: write
concurrency:
  group: hllv-reviewed-data-update
  cancel-in-progress: false
jobs:
  test-publish-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Apply only Type clarity changes
        run: |
          python3 .github/hllv-type-emphasis/publish_ui.py
          node --check .github/hllv-community/app.js
          git diff --check
      - name: Install browser test dependencies
        run: |
          python3 -m pip install --quiet playwright==1.55.0
          python3 -m playwright install --with-deps chromium webkit >/tmp/type-browsers.log 2>&1 || { tail -40 /tmp/type-browsers.log; exit 1; }
      - name: Test integrated forms and unchanged account component
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory hllv_tracker >/tmp/type-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          python3 .github/hllv-ux-20261012/test_browser.py
          python3 .github/hllv-ux-20261012/test_browser.py --engine webkit
          python3 .github/hllv-password/test_browser.py --standalone
          python3 .github/hllv-password/test_browser.py --standalone --engine webkit
          node .github/hllv-evidence/test_evidence.cjs
      - name: Publish tested Type changes to the tracker branch
        run: |
          set -euo pipefail
          git add -- .github/hllv-community/app.js .github/hllv-ux-20261012/form-types.js .github/hllv-ux-20261012/test_browser.py hllv_tracker/index.html hllv_tracker/assets hllv_tracker/data/issues.json hllv_tracker/data/issues.*.json hllv_tracker/deployment-manifest.json hllv_tracker/reviews/type-emphasis.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make feedback Type more apparent and separate idea context from proposal'
          git push origin HEAD:refs/heads/feature/hllv-bug-evidence-tracker
          echo "Published $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify ordinary live URLs and production forms
        run: |
          python3 -u - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          root=Path('hllv_tracker');paths=['','index.html']+json.loads((root/'deployment-manifest.json').read_text())['files'];last='Not checked'
          for attempt in range(120):
              try:
                  for path in paths:
                      with urllib.request.urlopen('https://hllv-bug-track.onrender.com/'+path,timeout=15) as r:actual=r.read()
                      assert actual==(root/(path.split('?')[0] or 'index.html')).read_bytes(),'Mismatch: '+(path or '/')
                  print('PRODUCTION_EXACT_MATCH');break
              except Exception as e:
                  last=str(e)
                  if attempt%12==0:print(last)
              time.sleep(5)
          else:raise RuntimeError(last)
          PY
          python3 .github/hllv-ux-20261012/test_browser.py --url https://hllv-bug-track.onrender.com/
          python3 .github/hllv-ux-20261012/test_browser.py --url https://hllv-bug-track.onrender.com/ --engine webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: type-clarity-previews
          path: artifacts/
          retention-days: 3
