name: HLLV bounded source discovery
on:
  push:
    branches: [feature/hllv-bug-evidence-tracker]
    paths: [.github/hllv-source-discovery/**, .github/workflows/hllv-source-discovery.yml]
permissions:
  contents: write
concurrency:
  group: hllv-reviewed-data-update
  cancel-in-progress: false
jobs:
  test-collect-publish-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Integrate bounded discovery without editing reviewed conclusions
        id: scope
        run: |
          python3 .github/hllv-source-discovery/install.py
          python3 .github/hllv-source-discovery/test_discovery.py
          python3 .github/hllv-source-discovery/test_affiliates.py
          python3 .github/hllv-source-responses/test_collector.py
          python3 .github/hllv-source-responses/test_content_review.py
          python3 .github/hllv-ux-20261012/test_feed.py
          node --check .github/hllv-source-responses/responses.js
          node .github/hllv-evidence/test_evidence.cjs
          git diff --check
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          print('publish='+str(json.loads(Path('.github/hllv-source-discovery/release.json').read_text())['publish']).lower())
          PY
      - name: Collect permitted public replies and report actual discovery scope
        run: |
          python3 .github/hllv-source-discovery/enrich.py
          mkdir -p artifacts
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('hllv_tracker/official-feed.json').read_text())['response_monitor']
          Path('artifacts/discovery-result.json').write_text(json.dumps(r,indent=2)+'\n')
          report={'existing_threads_complete':r['threads_complete'],'existing_threads_total':r['threads_total'],
                  'discovery':{k:v for k,v in r['discovery'].items() if k not in ('threads','candidates')},
                  'affiliate_monitor':r['affiliate_monitor'],'reviewed_bug_statuses_changed':False,'supabase_changed':False}
          Path('hllv_tracker/reviews/source-discovery.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Install isolated browser test dependencies
        run: |
          python3 -m pip install --quiet playwright==1.55.0
          python3 -m playwright install --with-deps chromium webkit >/tmp/discovery-browsers.log 2>&1 || { tail -40 /tmp/discovery-browsers.log; exit 1; }
      - name: Test scope visibility and unchanged member moderator journeys
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory hllv_tracker >/tmp/discovery-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for engine in chromium webkit; do
            python3 .github/hllv-source-discovery/test_browser.py --engine "$engine"
            python3 .github/hllv-source-responses/test_browser.py --engine "$engine"
            python3 .github/hllv-member-registration/test_browser.py --engine "$engine"
            python3 .github/hllv-submission-threads/test_browser.py --engine "$engine"
          done
      - name: Publish tested collector integration and generated presentation
        if: steps.scope.outputs.publish == 'true'
        run: |
          set -euo pipefail
          git add -- .github/hllv-source-responses/collector.py .github/hllv-source-responses/responses.js .github/hllv-ux-20261012/nightly.py .github/hllv-ux-20261012/test_feed.py hllv_tracker/index.html hllv_tracker/assets/source-responses-* hllv_tracker/data/issues.json hllv_tracker/data/issues.*.json hllv_tracker/deployment-manifest.json hllv_tracker/reviews/source-responses.json hllv_tracker/reviews/source-discovery.json hllv_tracker/official-feed.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Add bounded staff-response discovery with honest backlog and affiliate coverage'
            git push origin HEAD:refs/heads/feature/hllv-bug-evidence-tracker
          fi
          echo "Published $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify ordinary production URLs and integrated discovery display
        if: steps.scope.outputs.publish == 'true'
        run: |
          python3 -u - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          root=Path('hllv_tracker');paths=['','index.html','deployment-manifest.json','official-feed.json','reviews/source-discovery.json']+json.loads((root/'deployment-manifest.json').read_text())['files'];last='Not checked'
          for attempt in range(96):
              try:
                  for path in dict.fromkeys(paths):
                      with urllib.request.urlopen('https://hllv-bug-track.onrender.com/'+path,timeout=15) as r:actual=r.read(8000001)
                      assert actual==(root/(path.split('?')[0] or 'index.html')).read_bytes(),'Mismatch: '+(path or '/')
                  print('PRODUCTION_DISCOVERY_EXACT_MATCH');break
              except Exception as e:
                  last=str(e)
                  if attempt%12==0:print(last)
              time.sleep(5)
          else:raise RuntimeError(last)
          PY
          python3 .github/hllv-source-discovery/test_browser.py --url https://hllv-bug-track.onrender.com/
          python3 .github/hllv-source-discovery/test_browser.py --url https://hllv-bug-track.onrender.com/ --engine webkit
      - name: Report limitations independently of workflow success
        if: always()
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('artifacts/discovery-result.json')
          if path.exists():
              r=json.loads(path.read_text());d=r['discovery']
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('\nExisting-source coverage: '+str(r['threads_complete'])+'/'+str(r['threads_total'])+'.\n\n')
                  f.write('Discovery coverage: '+d['state']+'; '+str(d['threads_complete_this_run'])+'/'+str(d['threads_attempted_this_run'])+' selected threads complete; backlog '+str(d['awaiting_first_complete_scan'])+'. Not all Steam discussions.\n\n')
                  f.write('Affiliate directory checked; YouTube content collection NOT CONNECTED. No API key used.\n\n')
                  f.write('Tests use synthetic browser responses; real source scans and exact live-file checks are separate. No reviewed bug conclusions, accounts, private conversations or voting changed.\n')
              if d['state']!='window_checked':print('::warning::Discovery is partial or bounded by a backlog; do not claim complete forum coverage.')
              if d['identities_pending']:print('::warning::New staff identities need verification; no automatic promotion.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-discovery-results
          path: artifacts/
          retention-days: 3
