name: BREACH Hollow copy finalization
on:
  push:
    branches: [qa/breach-containment-08]
    paths: ['.github/workflows/breach-hollow-copy.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/breach-hollow-tested
      - name: Update shared exploration help without changing controls
        run: |
          test "$(git rev-parse HEAD)" = '4584c32ed0ee29d4c0f9297dd4e55d568fc20e4f'
          python - <<'PY'
          from pathlib import Path
          p=Path('daily_flyer/themes/breach_assets/index.html')
          s=p.read_text()
          old='Equipment upgrades open routes for the whole team.'
          assert s.count(old)==1
          p.write_text(s.replace(old,'Opened routes and discoveries are shared by the whole team.'))
          PY
          python -m unittest discover -s tests -p test_breach_export.py
          git diff --check
          git add daily_flyer/themes/breach_assets/index.html
          git config user.name 'BREACH development'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Clarify shared exploration help for both large operations'
          git push origin HEAD:refs/heads/qa/breach-hollow-tested
          git rev-parse HEAD
