<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sea & sky contract fixture — not the game engine</title><style>
:root{--ui-surface:#1e2b25;--ui-raised:#293a30;--ui-text:#ececdd;--ui-line:#50634d;--ui-accent:#d3b37e;--ui-muted:#bcc5b4;--paper:#202d26}*{box-sizing:border-box}body{margin:0;background:#15211b;color:#ececdd;font:14px/1.5 system-ui}button,select{font:inherit;color:inherit;min-height:44px;padding:8px 12px;background:#2c4134;border:1px solid #596e52;border-radius:4px;cursor:pointer}button:disabled{opacity:.5}[hidden]{display:none!important}main{padding:22px;max-width:1240px;margin:auto}header{padding:12px}.home-experience{padding:20px;border:1px solid #50634d;border-radius:8px;background:#1e2b25;margin-bottom:18px}#firstCommandHome{padding:20px;border:1px solid #50634d;border-radius:8px;margin-bottom:20px}#experimentalDesktopScreen,#mobileBattleScreen{position:fixed;inset:0;height:100dvh;display:grid;grid-template-areas:'top' 'map' 'nav' 'orders';grid-template-rows:58px minmax(0,1fr) 44px 132px;background:#19291f;overflow:hidden}#mobileBattleScreen{grid-template-rows:90px minmax(0,1fr) 44px 92px;padding:0 6px}#mobileBattleTop{grid-area:top;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:44px 44px;gap:2px 6px;align-items:center}#battleNavigation{display:flex;gap:4px}#battleViewOpen{font-size:12px}#mobileBattleStatus{font-size:12px}#mobileBattleStatus span{display:block;font-size:10px}#battleMission{grid-row:2;grid-column:1/-1;font-size:12px;min-height:44px;text-align:left}#mapWrap{grid-area:map;min-height:0;height:100%;overflow:auto;background:#65818a}#map{display:block;width:100%;height:100%;max-width:none}#mapWrap.enlarged #map{width:700px;height:auto;min-width:700px}.hex{fill:#427987;stroke:#6f9395;stroke-width:1}.hex.land{fill:#869773}.hex.objective{fill:#c4b379}.hex.move{stroke:#b8ddc3;stroke-width:2}.unit{cursor:pointer}.unit>rect{fill:#30594a;stroke:#eddfb6;stroke-width:1.4}.unit.de>rect{fill:#755346}.unit text{fill:#fff5df;font-size:10px;pointer-events:none}.unit .art{font-size:15px}.unit.selected>rect{stroke:#f4d58a;stroke-width:3}#mobileUnitNav{grid-area:nav;display:flex;align-items:center;gap:6px}#mobileUnitNav #mobileRosterOpen{flex:1}#mobileOrderDock{grid-area:orders;padding:4px 0;overflow:auto}#mobileOrderHead{display:flex;gap:6px;align-items:center;height:52px}#mobileOrderToggle{flex:1;min-width:0;text-align:left}.selected-unit-name,.selected-unit-meta{display:block}.selected-unit-meta{font-size:11px}#orderGuideOpen{width:44px;flex:none}#mobileOrderBody{display:flex;gap:6px;align-items:center}#hint{font-size:11px;margin:0;flex:1}#dadOrdersOpen{font-size:12px}#orders{display:flex;gap:6px;flex-wrap:wrap}.tactical-action{display:flex;gap:10px;align-items:center;text-align:left}.action-copy{flex:1;min-width:0}.action-name,.action-purpose,.action-reason{display:block}.action-name{font-weight:700}.action-purpose,.action-reason{font-size:12px}.action-cost{font-size:12px}.action-icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2}.tactical-action[data-tone=red]{background:#472a28;color:#f4d8ca}.tactical-action[data-tone=blue]{background:#223b49;color:#d0e7ea}dialog{background:#1e2b25;color:#ececdd;border:1px solid #59715b;padding:18px;width:min(600px,calc(100vw - 24px));max-height:90dvh;overflow:auto;border-radius:9px}dialog::backdrop{background:#0008}.mobile-sheet-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}#roster{display:grid;grid-template-columns:1fr 1fr;gap:8px}#playbackPanel{grid-area:orders;padding:10px;background:#243c30}#battleViewHelp{display:flex;flex-direction:column;gap:8px}#fieldCoachPrompt{position:fixed;bottom:180px;left:16px}#message{position:fixed;top:10px;left:10px;z-index:99;pointer-events:none;background:#25382d}#message:empty{display:none}
</style><!-- STYLES --></head><body><header><strong>DSL</strong> · CONTRACT FIXTURE</header><main>
<section id="lobby"><h1>SQUAD LEADER</h1><section class="home-experience"><select id="homeExperience"><option>simple</option><option>moderate</option><option>expert</option></select></section><section id="firstCommandHome"><h2>Learn by playing.</h2><p>Ground First Command · existing progress is preserved.</p></section><section id="greybridgeHome"><h2>Operation Greybridge</h2></section></section>
<section id="game" hidden><section id="battleScreen"><div id="mobileBattleTop"><nav id="battleNavigation"><button id="homeBattles">Home</button><button id="battleViewOpen">Simple<br>View &amp; help</button></nav><div id="mobileBattleStatus"><strong>YOUR TURN</strong><span>Round 1</span></div><button id="mobileMenuOpen">Battle</button><button id="battleMission">Mission</button></div><div id="mapWrap"><svg id="map" viewBox="0 0 556 519" role="group"></svg></div><nav id="mobileUnitNav"><button id="previousUnit">‹</button><button id="mobileRosterOpen">Your fleet</button><button id="nextUnit">›</button><button id="zoom">Detail</button></nav><div id="mobileOrderDock"><div id="mobileOrderHead"><button id="mobileOrderToggle"><strong class="selected-unit-name">Select a unit</strong><span class="selected-unit-meta"></span></button><button id="end">End turn →</button><button id="orderGuideOpen">?</button></div><div id="mobileOrderBody"><p id="hint">Select a unit to see its orders.</p><button id="dadOrdersOpen">Orders</button></div></div><div id="playbackPanel" hidden><p>Computer replay</p><button id="skipPlayback">Skip to live board</button></div></section></section></main>
<dialog id="dadOrders" class="mobile-battle-sheet"><div class="mobile-sheet-heading"><h2>Unit orders</h2><button id="ordersClose">Back to map</button></div><div id="orders"></div></dialog>
<dialog id="mobileRoster" class="mobile-battle-sheet"><div class="mobile-sheet-heading"><h2>Your units</h2><button id="rosterClose">Back to map</button></div><div id="roster"></div></dialog>
<dialog id="battleViewSettings"><div class="battle-view-heading"><h2>View &amp; help</h2><button id="viewClose">Back</button></div><div id="battleViewHelp"></div></dialog>
<button id="fieldCoachPrompt" hidden>Field coach</button><button id="lessonIgnore" hidden>Ignore tutorial</button><button id="redoOrder" hidden>Redo</button><button id="retryComputer" hidden>Retry</button><button id="showBattleResult" hidden>Result</button><p id="message"></p>
<script>
// Contract state models public hooks, NOT production AI, visibility or combat.
const storeData=window.TEST_STORAGE||{};Object.defineProperty(window,'localStorage',{value:{getItem:k=>storeData[k]||null,setItem:(k,v)=>storeData[k]=String(v),removeItem:k=>delete storeData[k]}});
const $=id=>document.getElementById(id);let state=null,session=null,selected=null,target=null,busy=false,polling=false,lobbyMode=true,playbackSession=null,smokeMode=false,barrageMode=false,combatMode=null;
let states={},savedSessions=[{code:'ground-existing',token:'test-only',operation:'tutorial'}],seq=0,failNext=false,loseNext=false,noTargets=false,replay=false;
const calls={creates:[],orders:[],reads:0,groundPause:0};const center=(x,y)=>[27+x*52+(y%2)*26,30+y*49],hexColumn=x=>String.fromCharCode(65+x),unitName=u=>u.name||u.kind,controlsUnit=()=>true;
const sideLabel=s=>state?.factions[s]||s;function notify(text){$('message').textContent=text;setTimeout(()=>$('message').textContent='',300)}
function initial(code,body){const air=body.scenario==='current:britain',side=body.side,enemy=side==='us'?'de':'us';
const unit=(id,kind,pos,extras={})=>({id,side,kind,name:{destroyer:'Fletcher · destroyer',carrier:'Enterprise · carrier',fighter:'Bf 109 · escort fighter',bomber:'He 111 · bomber'}[kind]||kind,pos,ap:kind==='fighter'?3:4,base_ap:3,hp:4,max_hp:4,...extras});
const s={code,scenario:{id:body.scenario,name:air?'Battle of Britain':'Midway',objective:[5,4],rounds:air?18:30},map:Array.from({length:10},()=>Array(10).fill(air?'field':'water')),ruleset:'dsl',edition:'current',battle_number:1,revision:0,round:1,side,turn:side,ready:true,winner:null,air_version:air?1:0,naval_version:air?0:1,factions:air?{us:'RAF',de:'Luftwaffe'}:{us:'Americans',de:'Japanese'},action_history:[],units:air?[unit('own1','fighter',[3,7]),unit('own2','bomber',[6,8],{bombs:2,max_bombs:2}),unit('base','airfield',[6,9],{ap:0,air_stores:6})]:[unit('own1','destroyer',[3,7],{torpedoes:2,repairs:2,repair_amount:2}),unit('own2','carrier',[6,8],{repairs:2,repair_amount:2})]};s.map[4][5]='objective';s.units.push({id:'enemy1',side:enemy,kind:air?'fighter':'destroyer',name:air?'RAF fighter':'Japanese destroyer',pos:[5,3],hp:4,ap:3},{id:'enemy2',side:enemy,kind:air?'airfield':'cruiser',name:air?'RAF sector station':'Japanese cruiser',pos:[6,4],hp:4,ap:0});return s;}
function legal(s){const all={};for(const u of s.units.filter(u=>u.side===s.side)){const l={moves:[],targets:[],torpedoes:[],airstrikes:[],recon:[],repair:false,rearm:false,overwatch:false};all[u.id]=l;if(u.hp<=0||s.turn!==s.side||s.winner||u.kind==='airfield')continue;
if(u.ap>=1)for(const [dx,dy]of [[0,-1],[1,0],[-1,0],[0,1]]){const pos=[u.pos[0]+dx,u.pos[1]+dy];if(pos[0]>=0&&pos[0]<10&&pos[1]>=0&&pos[1]<10)l.moves.push({pos,cost:1,path:s.air_version?[pos]:undefined});}
if(u.kind==='carrier'&&u.ap>=1&&!u.searched)l.recon=[[5,4],[4,4]];
if(u.ap>=2){l.overwatch=u.kind==='fighter'&&!u.overwatch;l.repair=!!s.naval_version&&u.hp<u.max_hp;l.rearm=!!s.air_version&&(u.hp<u.max_hp||u.kind==='bomber'&&u.bombs<2);
if(!noTargets){const e=s.units.find(e=>e.side!==s.side&&e.kind===(s.air_version?(u.kind==='bomber'?'airfield':'fighter'):'destroyer'));if(e)l.targets=[{id:e.id,threshold:4,damage:u.kind==='bomber'?2:1}];if(u.kind==='destroyer'&&u.torpedoes>0)l.torpedoes=l.targets.map(x=>({...x,damage:3}));}}
}return all;}
async function api(path,body){if(path!=='/api/match')throw Error('Unexpected route');calls.creates.push(body);const code='practice-'+ ++seq;states[code]=initial(code,body);states[code].legal=legal(states[code]);return{code,token:'fixture-only'}}
async function apiWithSession(seat){calls.reads++;if(!states[seat.code])throw Error('Unavailable');return structuredClone(states[seat.code]);}
function remember(s){session=s;state=null;selected=target=null;lobbyMode=false;savedSessions=[s,...savedSessions.filter(v=>v.code!==s.code)];}
async function run(fn){if(busy||playbackSession)return;busy=true;document.dispatchEvent(new Event('ww2:busy'));try{await fn();}catch(e){notify(e.message);}finally{busy=false;if(state)render();}}
async function act(body){await run(async()=>{calls.orders.push(body);if(failNext){failNext=false;throw Error('Rejected');}const s=structuredClone(states[session.code]),u=s.units.find(x=>x.id===body.unit);s.revision++;
if(body.kind==='move'){u.pos=body.pos.slice();u.ap--;}
if(body.kind==='recon'){u.ap--;u.searched=true;}
if(body.kind==='overwatch'){u.ap-=2;u.overwatch=true;}
if(['fire','torpedo','airstrike'].includes(body.kind)){u.ap-=2;if(body.kind==='torpedo')u.torpedoes--;if(u.kind==='bomber')u.bombs--;s.last_combat={revision:s.revision,result:'Missed.',threshold:4,roll:1};}
if(body.kind==='repair'){u.ap-=2;u.hp=Math.min(u.max_hp,u.hp+2);u.repairs--;}
if(body.kind==='rearm'){u.ap-=2;u.hp=u.max_hp;if(u.kind==='bomber')u.bombs=2;}
if(body.kind==='end'){s.round++;s.units.filter(x=>x.side===s.side).forEach(x=>{x.ap=4;x.overwatch=false;x.searched=false});if(replay)playbackSession={index:0,phase:'after'};}
s.action_history.push({revision:s.revision,side:s.side,action:body});s.legal=legal(s);states[s.code]=s;if(loseNext){loseNext=false;throw Error('Response lost after commit');}state=structuredClone(s);target=null;smokeMode=barrageMode=false;document.dispatchEvent(new CustomEvent('ww2:order',{detail:{kind:body.kind,code:s.code,battle:s.battle_number}}));});}
async function refresh(){state=await apiWithSession(session);render();}
function chooseUnit(u){if(busy||playbackSession)return;if(smokeMode||barrageMode||combatMode){act({kind:'smoke',unit:selected,pos:u.pos});return;}if(u.side===state.side){selected=u.id;target=null}else target=u.id;render();document.dispatchEvent(new Event('ww2:selection'));}
function focusMapUnit(u){if(!$('mapWrap').classList.contains('enlarged'))return;const [x,y]=center(...u.pos),w=$('mapWrap');w.scrollTo(x-w.clientWidth/2,y-w.clientHeight/2);}
window.ww2FirstCommand={pause(){calls.groundPause++;}};window.ww2Briefing={mission:s=>({goal:s.naval_version?'Reach 6 sea-control points or sink all enemy carriers.':'Destroy both RAF sector stations.',focus:s.scenario.objective})};window.ww2Experience={level:'simple'};window.ww2Mobile={openSheet:id=>{document.querySelectorAll('dialog[open]').forEach(d=>d.close());$(id).showModal();}};window.ww2ExperimentalDesktop={openContaining:()=>{}};window.ww2BattleNavigation={openContaining:()=>{}};
window.makeUnitPortrait=u=>{const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 42 42');svg.setAttribute('class','dad-unit-portrait');svg.innerHTML='<rect x="3" y="3" width="36" height="36" rx="6" fill="#3d6756" stroke="#dfc993"/><text x="21" y="27" text-anchor="middle" fill="#fff1ce" font-size="16">'+(u.kind==='fighter'?'✈':u.kind==='bomber'?'B':'S')+'</text>';return svg;};
function buttonOrder(id,label,reason=false){const b=document.createElement('button');b.id=id;b.className='tactical-action'+(reason?' order-unavailable':'');b.dataset.tone=['fire','torpedo'].includes(id)?'red':'blue';if(reason)b.setAttribute('aria-disabled','true');b.innerHTML='<svg class="action-icon" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M5 5h14v14H5Z"/></svg><span class="action-copy"><span class="action-name">'+label+'</span><span class="'+(reason?'action-reason':'action-purpose')+'">'+(reason?'Needs a legal target.':id==='overwatch'?'Prepare one possible reaction.':'Check the target and supplies before ordering.')+'</span></span><span class="action-cost">'+(id==='recon'?1:2)+' AP</span>';
b.onclick=()=>{if(reason)return;if(id==='recon'){const svg=$('map');for(const pos of state.legal[selected].recon){const t=document.createElementNS(svg.namespaceURI,'circle'),[x,y]=center(...pos);t.setAttribute('cx',x);t.setAttribute('cy',y);t.setAttribute('r',22);t.setAttribute('class','recon-choice');t.style.fill='#badcd5';t.onclick=()=>act({kind:'recon',unit:selected,pos});svg.append(t);}document.dispatchEvent(new Event('ww2:render'));$('dadOrders').close();}else{act({kind:id,unit:selected,target});$('dadOrders').close();}};return b;}
function render(){if(!state||lobbyMode)return;$('game').hidden=false;$('lobby').hidden=true;const screen=$('battleScreen')||$('mobileBattleScreen')||$('experimentalDesktopScreen'),mobile=innerWidth<1100;screen.id=mobile?'mobileBattleScreen':'experimentalDesktopScreen';document.body.classList.toggle('mobile-battle',mobile);document.body.classList.toggle('experimental-desktop',!mobile);document.body.classList.add('experimental-play');
$('battleMission').textContent=ww2Briefing.mission(state).goal;$('mobileBattleStatus').innerHTML='<strong>'+ (playbackSession?'REPLAY':'YOUR TURN')+'</strong><span>'+sideLabel(state.side)+' · Round '+state.round+'</span>';
const u=state.units.find(v=>v.id===selected);$('mobileOrderToggle').innerHTML='<strong class="selected-unit-name">'+(u?unitName(u):'Select a unit')+'</strong><span class="selected-unit-meta">'+(u?u.hp+'/'+u.max_hp+' strength · '+u.ap+' AP':'Open Your units')+'</span>';
const svg=$('map');svg.replaceChildren();state.map.forEach((row,y)=>row.forEach((type,x)=>{const [cx,cy]=center(x,y),p=document.createElementNS(svg.namespaceURI,'polygon');p.setAttribute('points',Array.from({length:6},(_,i)=>{const a=(60*i-30)*Math.PI/180;return[cx+30*Math.cos(a),cy+30*Math.sin(a)].join(',')}).join(' '));p.dataset.x=x;p.dataset.y=y;const m=state.legal[selected]?.moves.find(m=>same(m.pos,[x,y]));p.setAttribute('class','hex '+(state.air_version?'land ':type)+(m?' move':''));p.setAttribute('tabindex','0');p.onclick=()=>{if(m)act({kind:'move',unit:selected,pos:m.pos});};svg.append(p);}));
for(const v of state.units){const [x,y]=center(...v.pos),g=document.createElementNS(svg.namespaceURI,'g');g.dataset.unitId=v.id;g.setAttribute('class','unit '+v.side+(selected===v.id?' selected':''));g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',unitName(v));g.innerHTML='<rect x="'+(x-21)+'" y="'+(y-18)+'" width="42" height="36" rx="6"/><text x="'+x+'" y="'+(y-1)+'" text-anchor="middle" class="art">'+v.kind.slice(0,2).toUpperCase()+'</text><text x="'+x+'" y="'+(y+13)+'" text-anchor="middle">'+v.hp+' · '+v.ap+'</text>';g.onclick=()=>chooseUnit(v);g.onkeydown=e=>{if(e.key==='Enter')chooseUnit(v)};svg.append(g);}
$('roster').replaceChildren(...state.units.filter(v=>v.side===state.side).map(v=>{const b=document.createElement('button');b.dataset.unitId=v.id;b.innerHTML='<span class="roster-unit-name">'+unitName(v)+'</span><span class="roster-unit-state">'+v.hp+'/'+v.max_hp+' strength · '+v.ap+' AP</span>';b.onclick=()=>{chooseUnit(v);$('mobileRoster').close()};return b;}));
const l=state.legal[selected]||{},orders=[];for(const [id,label,ready]of [['recon','Search aircraft',l.recon?.length],['overwatch','Intercept',l.overwatch],['repair','Damage control',l.repair],['rearm','Aircraft service',l.rearm]])if(ready)orders.push(buttonOrder(id,label));
for(const [id,key,label]of [['fire','targets',u?.kind==='bomber'?'Bomb target':'Fire at unit'],['torpedo','torpedoes','Torpedoes'],['airstrike','airstrikes','Carrier strike']])if(l[key]?.length)orders.push(buttonOrder(id,label,!l[key].some(t=>t.id===target)));
$('orders').replaceChildren(...orders);$('playbackPanel').hidden=!playbackSession;$('fieldCoachPrompt').hidden=false;document.dispatchEvent(new Event('ww2:render'));}
function same(a,b){return a[0]===b[0]&&a[1]===b[1]}
$('end').onclick=()=>{if(confirm('End your army’s turn?'))act({kind:'end'});};$('dadOrdersOpen').onclick=()=>ww2Mobile.openSheet('dadOrders');$('ordersClose').onclick=()=>$('dadOrders').close();$('mobileRosterOpen').onclick=()=>ww2Mobile.openSheet('mobileRoster');$('rosterClose').onclick=()=>$('mobileRoster').close();$('battleViewOpen').onclick=()=>ww2Mobile.openSheet('battleViewSettings');$('viewClose').onclick=()=>$('battleViewSettings').close();$('homeBattles').onclick=()=>{lobbyMode=true;$('game').hidden=true;$('lobby').hidden=false;document.body.classList.remove('mobile-battle','experimental-desktop');document.querySelectorAll('dialog[open]').forEach(d=>d.close());};$('zoom').onclick=()=>$('mapWrap').classList.toggle('enlarged');$('skipPlayback').onclick=()=>{playbackSession=null;render();document.dispatchEvent(new Event('ww2:playback'));};$('lessonIgnore').onclick=()=>{localStorage.setItem('ww2-coaching-preferences-v1','{"ignored":true}');};
window.addEventListener('resize',()=>{if(state&&!lobbyMode)render();});
</script><!-- MODULES --></body></html>
