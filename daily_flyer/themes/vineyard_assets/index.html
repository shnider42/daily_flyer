<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17141d">
  <meta name="description" content="Gather around a Tuscan vineyard table. Grow vines, make wine, and play a seasonal strategy game with friends.">
  <title>Vineyard Table · A DailyFlyer game</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to game</a>
  <header class="site-header">
    <button class="brand" id="home-button" aria-label="Vineyard Table home">
      <img src="/icon.svg" width="40" height="40" alt="">
      <span><strong>Vineyard Table</strong><small id="connection-status" role="status">A DAILY FLYER GAME</small></span>
    </button>
    <nav class="header-tools" aria-label="Game tools">
      <button id="help-button" class="icon-button" aria-label="How to play" title="How to play"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.4 9.2a2.7 2.7 0 1 1 4.1 2.3c-1.1.6-1.5 1.1-1.5 2.1M12 17h.01"/></svg><span class="desktop-label">How to play</span></button>
      <button id="settings-button" class="icon-button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg><span class="desktop-label">Settings</span></button>
    </nav>
  </header>
  <main id="app" tabindex="-1"><div class="loading-screen"><span class="leaf-spinner" aria-hidden="true">❧</span><h1>Setting the table…</h1><p>The vineyard will be with you in a moment.</p></div></main>
  <dialog id="sheet" aria-label="Game details"><div id="sheet-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Vineyard Table needs JavaScript to play. Please enable it and refresh.</p></noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
