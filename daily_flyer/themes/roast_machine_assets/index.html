<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ef">
  <meta name="description" content="Pick a few habits, add a name, and make a roast.">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Roast Machine</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="rm-app">
    <a class="rm-skip" href="#rm-name">Skip to the form</a>
    <header class="rm-masthead">
      <h1 id="rm-title">Roast Machine</h1>
    </header>

    <main class="rm-main">
      <div class="rm-workbench">
        <section class="rm-input-panel" aria-label="Build your roast">
          <form id="rm-form" method="post" autocomplete="off" novalidate>
            <div class="rm-name-field">
              <div class="rm-name-label"><label for="rm-name">Name or nickname</label><button class="rm-text-button" type="button" id="rm-example">Try an example</button></div>
              <input id="rm-name" name="name" type="text" placeholder="e.g. Alex" maxlength="50" required autocomplete="off" spellcheck="false" aria-describedby="rm-name-error">
              <p id="rm-name-error" class="rm-error" hidden></p>
            </div>

            <p class="rm-traits-help">Choose what fits. The dropdowns are optional.</p>
            <div class="rm-select-grid" id="rm-select-grid">
              <div class="rm-field"><label for="rm-personality">Personality</label><select id="rm-personality" name="personality"><option value="">Leave this out</option></select></div>
              <div class="rm-field"><label for="rm-job">Day job</label><select id="rm-job" name="job"><option value="">Leave this out</option></select></div>
              <div class="rm-field"><label for="rm-hobby">Hobby</label><select id="rm-hobby" name="hobby"><option value="">Leave this out</option></select></div>
              <div class="rm-field"><label for="rm-chat">Group chat</label><select id="rm-chat" name="chat"><option value="">Leave this out</option></select></div>
              <div class="rm-field"><label for="rm-style">Dress code</label><select id="rm-style" name="style"><option value="">Leave this out</option></select></div>
              <div class="rm-field"><label for="rm-habit">Bad habit</label><select id="rm-habit" name="habit"><option value="">Leave this out</option></select></div>
              <div class="rm-field"><label for="rm-occasion">Occasion</label><select id="rm-occasion" name="occasion"><option value="just_because">Just because</option></select></div>
              <div class="rm-field rm-heat-field"><label for="rm-heat">Heat</label><select id="rm-heat" name="heat" aria-describedby="rm-heat-description"><option value="mild">Mild</option><option value="medium" selected>Medium</option><option value="savage">Savage</option></select></div>
            </div>
            <p class="rm-heat-description" id="rm-heat-description">Medium: sharper jokes.</p>

            <div class="rm-notes-field">
              <div class="rm-notes-label"><label for="rm-details">Details <span>(optional)</span></label><span id="rm-count" aria-hidden="true">0 / 600</span></div>
              <textarea id="rm-details" name="details" maxlength="600" rows="3" placeholder="Says “five minutes away” before leaving the house." aria-describedby="rm-details-help"></textarea>
              <p id="rm-details-help">Habits and quirks work best. Keep private information out.</p>
            </div>

            <div class="rm-submit-row"><button class="rm-roast-button" id="rm-roast" type="submit" disabled>ROAST</button><button class="rm-text-button rm-reset-button" id="rm-reset" type="button">Clear</button></div>
            <p class="rm-under-button" id="rm-form-status" role="status"></p>
          </form>
        </section>

        <section class="rm-output-panel" aria-labelledby="rm-output-label">
          <div class="rm-output-rule"><h2 id="rm-output-label">Roast</h2><span id="rm-receipt-heat" class="rm-heat-summary"></span><span id="rm-batch" hidden>No. 000</span></div>
          <div id="rm-printer">
            <div class="rm-receipt" id="rm-receipt" tabindex="-1" aria-labelledby="rm-receipt-title">
              <div class="rm-empty" id="rm-empty">
                <p id="rm-receipt-title">Your roast will appear here.</p>
              </div>
              <div class="rm-result" id="rm-result" hidden>
                <h2 id="rm-target-name"></h2>
                <div id="rm-roast-text" class="rm-roast-text"></div>
              </div>
            </div>
          </div>
          <p id="rm-detail-note" class="rm-detail-note" hidden></p>
          <div class="rm-result-actions" id="rm-result-actions" hidden>
            <button class="rm-action-button rm-again-button" id="rm-again" type="button">Roast again</button>
            <button class="rm-action-button" id="rm-copy" type="button"><span id="rm-copy-label">Copy roast</span></button>
          </div>
          <p class="rm-output-status" id="rm-output-status" role="status" aria-live="polite"></p>
          <div class="rm-copy-fallback" id="rm-copy-fallback" hidden><label for="rm-copy-text">Select and copy your roast</label><textarea id="rm-copy-text" readonly rows="6"></textarea></div>
        </section>
      </div>
    </main>

    <footer class="rm-footer"><span>DailyFlyer</span><span>Names and details stay in this tab.</span></footer>
    <noscript><div class="rm-noscript">Enable JavaScript and reload to make a roast.</div></noscript>
  </div>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
