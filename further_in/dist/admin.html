<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121913">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin — FURTHER IN</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header><a class="brand" href="./">DF <span>/</span> DAILYFLYER</a><span class="edition">FURTHER IN</span></header>
  <main>
    <section id="gate" class="gate" aria-labelledby="gate-title">
      <p class="eyebrow">AUTHORIZED ACCESS</p>
      <h1 id="gate-title">Behind the door.</h1>
      <p class="intro">Enter your admin code to continue.</p>
      <form id="unlock-form">
        <label for="admin-code">Admin code</label>
        <input id="admin-code" name="code" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required aria-describedby="gate-error">
        <p id="gate-error" class="error" role="status" aria-live="polite"></p>
        <button class="primary" type="submit">Unlock <span aria-hidden="true">↗</span></button>
      </form>
      <a class="back" href="./">← Back to the game</a>
      <noscript><p>Enable JavaScript to enter.</p></noscript>
    </section>
    <section id="admin-panel" hidden aria-label="Admin controls"></section>
  </main>
  <footer>DAILYFLYER ENTERTAINMENT</footer>
  <script type="module" src="admin.mjs"></script>
</body>
</html>
